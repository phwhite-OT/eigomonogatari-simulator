name: Metagame V12 distributed finalization accelerator

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "scripts/plan-metagame-v12-finalization.mjs"
      - "scripts/evaluate-metagame-v12-finalization-shard.mjs"
      - "scripts/reopen-metagame-v12-deep-search.mjs"
      - "scripts/prefill-metagame-v12-finalization.mjs"
      - "scripts/metagame-v12-evaluation-pool.mjs"
      - ".github/workflows/metagame-v12-finalization-fanout.yml"
permissions:
  actions: write
  contents: write

# All writers serialize through one group. Do not preempt active calculation
# waves on source pushes: every worker uploads a durable delta, and a newer
# workflow can recover those deltas before planning the remaining work.
concurrency:
  group: metagame-v12-shared-pool-recompute
  cancel-in-progress: false

jobs:
  refresh_rankings:
    concurrency:
      group: metagame-v12-result-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh completed cost100 rankings from existing battle evidence
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          report_root="reports/metagame-ratings-v12-team-opportunity"
          ranking_policy="full-budget-opportunity-v9-adaptive-metagame"
          if [ -z "$(git ls-remote --heads origin "$results_branch")" ]; then
            echo "No results branch exists yet."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"

          groups=(
            "fire-100" "water-100" "wind-100"
            "fire-water-100" "fire-wind-100" "water-wind-100"
            "fire-water-wind-100"
          )
          work_root="$RUNNER_TEMP/v12-finalize-ranking-refresh"
          mkdir -p "$work_root"
          refreshed=()
          for output_directory in "${groups[@]}"; do
            progress_path="$report_root/$output_directory/progress.json"
            source_path="$report_root/$output_directory/report.json"
            marker_path="$report_root/$output_directory/ranking-policy.txt"
            input_id="${output_directory%-100}:100"
            marker="$(git show "$results_ref:$marker_path" 2>/dev/null || true)"

            if ! git show "$results_ref:$progress_path" 2>/dev/null | jq -e --arg input_id "$input_id" '
              .status == "complete"
              and .context.inputId == $input_id
              and .context.version == "team-battle-v12.5-effective-damage-individual-rank"
              and .context.battleSemantics == "opportunity-baseline-v6-target-priority"
              and .finalizationState.version == 2
            ' >/dev/null 2>&1; then
              echo "Skipping $output_directory: current completed checkpoint is not available yet."
              continue
            fi
            if [ "$marker" = "$ranking_policy" ]; then
              echo "Skipping $output_directory: ranking already uses $ranking_policy."
              continue
            fi

            input_report="$work_root/$output_directory-report.json"
            output_report="$work_root/$output_directory-report-out.json"
            output_csv="$work_root/$output_directory-ranking.csv"
            if ! git show "$results_ref:$source_path" > "$input_report" 2>/dev/null || [ ! -s "$input_report" ]; then
              echo "Skipping $output_directory: completed report is missing."
              continue
            fi
            if ! jq -e '.adaptiveMetagame.version == 2' "$input_report" >/dev/null 2>&1; then
              echo "Skipping $output_directory: legacy fixed-environment report must be upgraded by shared-pool recompute."
              continue
            fi
            node scripts/rerank-metagame-v12-report.mjs \
              --report="$input_report" \
              --output="$output_report" \
              --csv="$output_csv"
            refreshed+=("$output_directory")
          done

          if [ "${#refreshed[@]}" -eq 0 ]; then
            echo "No completed cost100 ranking needed a refresh."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "$results_ref"
          git switch -C "$results_branch"
          for output_directory in "${refreshed[@]}"; do
            output_path="$report_root/$output_directory"
            cp "$work_root/$output_directory-report-out.json" "$output_path/report.json"
            cp "$work_root/$output_directory-ranking.csv" "$output_path/ranking.csv"
            printf '%s\n' "$ranking_policy" > "$output_path/ranking-policy.txt"
          done
          git add -f "$report_root"
          if git diff --cached --quiet; then
            echo "Completed cost100 rankings already match $ranking_policy."
            exit 0
          fi
          git commit -m "chore: refresh V12 cost100 rankings before finalization"
          git push --force-with-lease=refs/heads/$results_branch origin HEAD:$results_branch

  select:
    needs: refresh_rankings
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.target.outputs.should_run }}
      input: ${{ steps.target.outputs.input }}
      output_directory: ${{ steps.target.outputs.output_directory }}
      cursor: ${{ steps.target.outputs.cursor }}
      plan_length: ${{ steps.target.outputs.plan_length }}
      recovery_run_id: ${{ steps.target.outputs.recovery_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - id: target
        name: Select active counterfactual finalization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          ranking_policy="full-budget-opportunity-v9-adaptive-metagame"
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "input=" >> "$GITHUB_OUTPUT"
          echo "output_directory=" >> "$GITHUB_OUTPUT"
          echo "cursor=0" >> "$GITHUB_OUTPUT"
          echo "plan_length=0" >> "$GITHUB_OUTPUT"
          echo "recovery_run_id=" >> "$GITHUB_OUTPUT"

          if [ -z "$(git ls-remote --heads origin "$results_branch")" ]; then
            echo "No V12 results branch exists yet."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"

          attribute_groups=(
            "fire" "water" "wind"
            "fire-water" "fire-wind" "water-wind" "fire-water-wind"
          )
          representative_costs=(100 200 300 500)
          for cost in "${representative_costs[@]}"; do
            for attribute_group in "${attribute_groups[@]}"; do
              input="${attribute_group}:${cost}"
              output_directory="${attribute_group}-${cost}"
              progress_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}/progress.json"
              summary_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}/progress-summary.json"
              marker_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}/ranking-policy.txt"
              state="$(git show "$results_ref:$summary_path" 2>/dev/null || true)"
              if [ -z "$state" ]; then
                state="$(git show "$results_ref:$progress_path" 2>/dev/null | jq -c '{
                  schemaVersion: 1,
                  status,
                  updatedAt,
                  context: {
                    version: .context.version,
                    battleSemantics: .context.battleSemantics,
                    inputId: .context.inputId
                  },
                  finalizationState: (
                    if .finalizationState then {
                      version: .finalizationState.version,
                      phase: .finalizationState.phase,
                      cursor: {planIndex: (.finalizationState.cursor.planIndex // 0)},
                      planLength: ((.finalizationState.plan // []) | length)
                    } else null end
                  ),
                  adaptiveMetagameVersion: (.adaptiveMetagame.version // null)
                }' || true)"
              fi
              marker="$(git show "$results_ref:$marker_path" 2>/dev/null || true)"

              if [ -n "$state" ] && \
                 jq -e '.status == "complete" and .context.version == "team-battle-v12.5-effective-damage-individual-rank" and .context.battleSemantics == "opportunity-baseline-v6-target-priority" and .finalizationState.version == 2' <<< "$state" >/dev/null 2>&1; then
                # Ranking-only policy refreshes are handled separately. They
                # must never block discovery of a later condition whose battle
                # finalization is still active.
                continue
              fi

              if [ -n "$state" ] && \
                 jq -e '.status == "finalizing" and .context.version == "team-battle-v12.5-effective-damage-individual-rank" and .context.battleSemantics == "opportunity-baseline-v6-target-priority" and .finalizationState.phase == "counterfactual" and (.finalizationState.cursor.planIndex < .finalizationState.planLength)' <<< "$state" >/dev/null 2>&1; then
                cursor="$(jq -r '.finalizationState.cursor.planIndex' <<< "$state")"
                plan_length="$(jq -r '.finalizationState.planLength' <<< "$state")"
                recovery_run_id=""
                runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/metagame-v12-finalization-fanout.yml/runs?per_page=20" 2>/dev/null || true)"
                if [ -n "$runs_json" ]; then
                  while IFS= read -r candidate_run_id; do
                    artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts?per_page=100" 2>/dev/null || true)"
                    [ -n "$artifacts_json" ] || continue
                    prefix="v12-finalize-cache-${output_directory}-"
                    if jq -e --arg prefix "$prefix" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | length > 0' <<< "$artifacts_json" >/dev/null; then
                      recovery_run_id="$candidate_run_id"
                      break
                    fi
                  done < <(jq -r --argjson current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.id != $current) | .id' <<< "$runs_json")
                fi

                echo "should_run=true" >> "$GITHUB_OUTPUT"
                echo "input=$input" >> "$GITHUB_OUTPUT"
                echo "output_directory=$output_directory" >> "$GITHUB_OUTPUT"
                echo "cursor=$cursor" >> "$GITHUB_OUTPUT"
                echo "plan_length=$plan_length" >> "$GITHUB_OUTPUT"
                echo "recovery_run_id=$recovery_run_id" >> "$GITHUB_OUTPUT"
                if [ -n "$recovery_run_id" ]; then
                  echo "Accelerating $input from frozen plan cursor $cursor/$plan_length and recovering deltas from run $recovery_run_id."
                else
                  echo "Accelerating $input from frozen plan cursor $cursor/$plan_length."
                fi
              else
                echo "First incomplete condition $input is not ready for distributed finalization."
              fi
              exit 0
            done
          done
          echo "All 28 V12 conditions already have the current ranking policy."

  plan:
    needs: select
    outputs:
      shard_matrix: ${{ steps.shards.outputs.shard_matrix }}
    if: needs.select.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      METAGAME_INPUT: ${{ needs.select.outputs.input }}
      METAGAME_OUTPUT_DIRECTORY: ${{ needs.select.outputs.output_directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore one durable finalization checkpoint
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          git fetch --no-tags --depth=1 origin "+refs/heads/$results_branch:$results_ref"
          mkdir -p "$RUNNER_TEMP/v12-finalize-work"
          progress_path="reports/metagame-ratings-v12-team-opportunity/${METAGAME_OUTPUT_DIRECTORY}/progress.json"
          git show "$results_ref:$progress_path" > "$RUNNER_TEMP/v12-finalize-work/checkpoint.json"
          test -s "$RUNNER_TEMP/v12-finalize-work/checkpoint.json"
      - name: Validate accelerator scripts
        shell: bash
        run: |
          node --check scripts/plan-metagame-v12-finalization.mjs
          node --check scripts/evaluate-metagame-v12-finalization-shard.mjs
          node --check scripts/reopen-metagame-v12-deep-search.mjs
          node --check scripts/merge-metagame-v12-finalization-deltas.mjs
          node --check scripts/advance-metagame-v12-finalization-cache.mjs
      - name: Download recoverable deltas from the previous interrupted wave
        if: needs.select.outputs.recovery_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: v12-finalize-cache-${{ needs.select.outputs.output_directory }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/v12-finalize-recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select.outputs.recovery_run_id }}
      - name: Merge recovered cache deltas before replanning
        if: needs.select.outputs.recovery_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t delta_files < <(find "$RUNNER_TEMP/v12-finalize-recovery" -maxdepth 1 -type f -name "${METAGAME_OUTPUT_DIRECTORY}-finalization-shard-*.json" -print | sort)
          if [ "${#delta_files[@]}" -eq 0 ]; then
            echo "::error::Recovery run contained no usable finalization delta files."
            exit 1
          fi
          delta_paths="$(IFS=,; echo "${delta_files[*]}")"
          node scripts/merge-metagame-v12-finalization-deltas.mjs \
            --checkpoint="$RUNNER_TEMP/v12-finalize-work/checkpoint.json" \
            --deltas="$delta_paths"
      - name: Build globally deduplicated finalization work plan
        shell: bash
        run: |
          node scripts/plan-metagame-v12-finalization.mjs \
            --input="$METAGAME_INPUT" \
            --input-checkpoint="$RUNNER_TEMP/v12-finalize-work/checkpoint.json" \
            --output-manifest="$RUNNER_TEMP/v12-finalize-work/manifest.json" \
            --shard-count=38 \
            --parallel-runner-count=19 \
            --compact-shard-threshold=3800 \
            --deep-seed-count=12
      - id: shards
        name: Build active shard matrix
        shell: bash
        run: |
          shard_count="$(jq -r '.shardCount' "$RUNNER_TEMP/v12-finalize-work/manifest.json")"
          shard_matrix="$(jq -cn --argjson count "$shard_count" '{shard:[range(0; $count)]}')"
          echo "shard_matrix=$shard_matrix" >> "$GITHUB_OUTPUT"
          echo "Scheduling $shard_count finalization shard(s)."
      - name: Upload lightweight work plan
        uses: actions/upload-artifact@v4
        with:
          name: v12-finalize-work-${{ needs.select.outputs.output_directory }}
          path: ${{ runner.temp }}/v12-finalize-work/manifest.json
          if-no-files-found: error
          retention-days: 2

  prefill:
    needs: [select, plan]
    if: needs.select.outputs.should_run == 'true' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 135
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix: ${{ fromJSON(needs.plan.outputs.shard_matrix) }}
    env:
      METAGAME_INPUT: ${{ needs.select.outputs.input }}
      METAGAME_OUTPUT_DIRECTORY: ${{ needs.select.outputs.output_directory }}
      PREFILL_TIME_BUDGET_SECONDS: "7200"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download globally deduplicated work plan
        uses: actions/download-artifact@v4
        with:
          name: v12-finalize-work-${{ needs.select.outputs.output_directory }}
          path: ${{ runner.temp }}/v12-finalize-work
      - name: Prepare shard output directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/v12-finalize-delta"
      - id: prefill
        name: Evaluate assigned unique counterfactual battles
        continue-on-error: true
        shell: bash
        run: |
          node scripts/evaluate-metagame-v12-finalization-shard.mjs \
            --input="$METAGAME_INPUT" \
            --work-manifest="$RUNNER_TEMP/v12-finalize-work/manifest.json" \
            --output-checkpoint="$RUNNER_TEMP/v12-finalize-delta/${METAGAME_OUTPUT_DIRECTORY}-finalization-shard-${{ matrix.shard }}.json" \
            --shard-index=${{ matrix.shard }} \
            --workers=4 \
            --checkpoint-every=128 \
            --checkpoint-interval-seconds=300 \
            --time-budget-seconds="$PREFILL_TIME_BUDGET_SECONDS"
      - name: Upload finalization cache delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-finalize-cache-${{ needs.select.outputs.output_directory }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/v12-finalize-delta/${{ needs.select.outputs.output_directory }}-finalization-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 2
      - name: Propagate prefill failure after delta upload
        if: always() && steps.prefill.outcome == 'failure'
        run: exit 1

  merge:
    concurrency:
      group: metagame-v12-result-writer
      cancel-in-progress: false
    needs: [select, plan, prefill]
    if: always() && needs.select.outputs.should_run == 'true' && needs.plan.result == 'success' && needs.prefill.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      METAGAME_INPUT: ${{ needs.select.outputs.input }}
      METAGAME_OUTPUT_DIRECTORY: ${{ needs.select.outputs.output_directory }}
      # Fanout owns all expensive simulations. Merge may spend substantial time
      # parsing large cache deltas, but it must never run missing battles itself;
      # residual misses are picked up by the next globally deduplicated fanout.
      FINALIZE_TIME_BUDGET_SECONDS: "600"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore isolated recompute snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"
          git switch --detach "origin/master"
          if git cat-file -e "$results_ref:reports/metagame-ratings-v12-team-opportunity" 2>/dev/null; then
            git checkout "$results_ref" -- reports/metagame-ratings-v12-team-opportunity
          fi
          git switch --create "$results_branch"
      - name: Download deep-search work manifest
        uses: actions/download-artifact@v4
        with:
          name: v12-finalize-work-${{ needs.select.outputs.output_directory }}
          path: ${{ runner.temp }}/v12-finalize-work
      - name: Download distributed finalization cache deltas
        uses: actions/download-artifact@v4
        with:
          pattern: v12-finalize-cache-${{ needs.select.outputs.output_directory }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/v12-finalize-delta
      - name: Merge exact caches and advance the frozen plan
        shell: bash
        run: |
          set -euo pipefail
          output_path="reports/metagame-ratings-v12-team-opportunity/${METAGAME_OUTPUT_DIRECTORY}"
          checkpoint_path="${output_path}/progress.json"
          mapfile -t delta_files < <(find "$RUNNER_TEMP/v12-finalize-delta" -maxdepth 1 -type f -name "${METAGAME_OUTPUT_DIRECTORY}-finalization-shard-*.json" -print 2>/dev/null | sort || true)
          if [ "${#delta_files[@]}" -eq 0 ]; then
            echo "::error::No distributed cache deltas were downloaded. Refusing to discard a completed fanout wave."
            exit 1
          fi
          delta_paths="$(IFS=,; echo "${delta_files[*]}")"
          echo "Merging ${#delta_files[@]} globally-disjoint cache delta(s) without rebuilding rankings."

          node scripts/merge-metagame-v12-finalization-deltas.mjs \
            --checkpoint="$checkpoint_path" \
            --deltas="$delta_paths"

          node scripts/advance-metagame-v12-finalization-cache.mjs \
            --input="$METAGAME_INPUT" \
            --checkpoint="$checkpoint_path"

          if jq -e '.finalizationState.phase == "complete"' "$checkpoint_path" >/dev/null; then
            echo "Frozen counterfactual plan is fully cached; running the expensive reconcile/adaptive pass once."
            node scripts/rate-metagame-v12.mjs \
              --input="$METAGAME_INPUT" \
              --position=all \
              --checkpoint-path="$checkpoint_path" \
              --time-budget-seconds="$FINALIZE_TIME_BUDGET_SECONDS" \
              --finalize-only=true

            # A completed bounded counterfactual plan is not enough anymore.
            # Reopen only after the expensive reconcile pass, when the measured
            # elite frontier can actually have changed.
            node scripts/reopen-metagame-v12-deep-search.mjs \
              --checkpoint="$checkpoint_path" \
              --manifest="$RUNNER_TEMP/v12-finalize-work/manifest.json" \
              --max-rounds=16
          else
            echo "Counterfactual plan still has a cache miss; skipping full shared-pool reconciliation for this intermediate wave."
          fi

          jq -c '{
            schemaVersion: 1,
            status,
            updatedAt,
            context: {
              version: .context.version,
              battleSemantics: .context.battleSemantics,
              inputId: .context.inputId
            },
            finalizationState: (
              if .finalizationState then {
                version: .finalizationState.version,
                phase: .finalizationState.phase,
                cursor: {planIndex: (.finalizationState.cursor.planIndex // 0)},
                planLength: ((.finalizationState.plan // []) | length)
              } else null end
            ),
            adaptiveMetagameVersion: (.adaptiveMetagame.version // null)
          }' "$checkpoint_path" > "${output_path}/progress-summary.json"

          ranking_policy="full-budget-opportunity-v9-adaptive-metagame"
          if jq -e '.status == "complete"' "$checkpoint_path" >/dev/null; then
            printf '%s\n' "$ranking_policy" > "${output_path}/ranking-policy.txt"
            echo "Distributed finalization complete for $METAGAME_INPUT after converged deep search."
          else
            rm -f "${output_path}/ranking-policy.txt"
            cursor="$(jq -r '.finalizationState.cursor.planIndex' "$checkpoint_path")"
            plan_length="$(jq -r '.finalizationState.plan | length' "$checkpoint_path")"
            round="$(jq -r '.finalizationState.deepSearchRound // 1' "$checkpoint_path")"
            echo "Distributed finalization checkpoint saved at $cursor/$plan_length, deep-search round $round."
          fi
      - name: Save distributed finalization progress
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          git add -f reports/metagame-ratings-v12-team-opportunity
          if ! git diff --cached --quiet; then
            git commit -m "chore: save distributed V12 finalization progress"
            git push --force-with-lease=refs/heads/$results_branch origin HEAD:$results_branch
          fi
      - name: Continue accelerator or normal recompute
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkpoint_path="reports/metagame-ratings-v12-team-opportunity/${METAGAME_OUTPUT_DIRECTORY}/progress.json"
          if jq -e '.status == "complete"' "$checkpoint_path" >/dev/null; then
            workflow="metagame-v12-shared-pool-recompute.yml"
            echo "Condition complete; returning control to the normal recompute workflow."
          else
            workflow="metagame-v12-finalization-fanout.yml"
            echo "Condition still finalizing; scheduling another globally deduplicated accelerator segment."
          fi

          output=""
          delay=5
          for attempt in 1 2 3 4 5; do
            if output="$(gh workflow run "$workflow" --repo "${{ github.repository }}" --ref master 2>&1)"; then
              echo "Continuation dispatch accepted on attempt $attempt."
              exit 0
            fi
            echo "Continuation dispatch attempt $attempt failed: $output" >&2
            if ! grep -Eqi 'HTTP (500|502|503|504)|Failed to run workflow dispatch|temporar|timeout|connection reset|service unavailable|bad gateway|gateway timeout' <<< "$output"; then
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::warning::Continuation dispatch still has a transient GitHub error after 5 attempts; durable progress is already pushed."
          exit 0
