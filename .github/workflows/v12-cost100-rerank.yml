name: V12 cost100 lightweight rerank

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/core/metagame-v12.js"
      - "scripts/plan-metagame-v12-browser-knowledge.mjs"
      - "scripts/rerank-metagame-v12-report.mjs"
      - "test/metagame-v12.test.js"
      - ".github/workflows/v12-cost100-rerank.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: metagame-v12-lightweight-rerank
  # Do not queue behind the 19-runner battle wave; this workflow is the intended spare-slot sidecar.
  cancel-in-progress: false

jobs:
  rerank:
    concurrency:
      group: metagame-v12-result-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait out legacy V12 writers from before the writer lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Commit that introduced metagame-v12-result-writer on every heavy result writer.
          writer_lock_barrier="6f4785e904879f5cbdbce736fb917c297a408eb5"
          workflows=(
            "metagame-v12-shared-pool-recompute.yml"
            "metagame-v12-finalization-fanout.yml"
          )
          statuses=("in_progress" "queued" "pending")

          for attempt in $(seq 1 80); do
            legacy_runs=()
            for workflow in "${workflows[@]}"; do
              for status in "${statuses[@]}"; do
                runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=${status}&per_page=100" 2>/dev/null || echo '{"workflow_runs":[]}')"
                while IFS=
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          report_root="reports/metagame-ratings-v12-team-opportunity"
          ranking_policy="full-budget-opportunity-v6-cost-weighted-slot"
          git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"

          groups=(
            "fire-100"
            "water-100"
            "wind-100"
            "fire-water-100"
            "fire-wind-100"
            "water-wind-100"
            "fire-water-wind-100"
          )

          work_root="$RUNNER_TEMP/v12-cost100-rerank"
          mkdir -p "$work_root/input" "$work_root/output"
          reranked_file="$work_root/reranked-groups.txt"
          : > "$reranked_file"

          for output_directory in "${groups[@]}"; do
            input_report="$work_root/input/$output_directory-report.json"
            output_report="$work_root/output/$output_directory-report.json"
            output_csv="$work_root/output/$output_directory-ranking.csv"
            source_path="$report_root/$output_directory/report.json"
            progress_path="$report_root/$output_directory/progress.json"
            marker_path="$report_root/$output_directory/ranking-policy.txt"
            input_id="${output_directory%-100}:100"
            marker="$(git show "$results_ref:$marker_path" 2>/dev/null || true)"

            if ! git show "$results_ref:$progress_path" 2>/dev/null | jq -e --arg input_id "$input_id" '
              .status == "complete"
              and .context.inputId == $input_id
              and .context.version == "team-battle-v12.5-effective-damage-individual-rank"
              and .context.battleSemantics == "opportunity-baseline-v5-effective-damage"
              and .finalizationState.version == 2
            ' >/dev/null 2>&1; then
              echo "Skipping $output_directory: current completed cost100 checkpoint is not available yet."
              continue
            fi
            if [ "$marker" = "$ranking_policy" ]; then
              echo "Skipping $output_directory: ranking already uses $ranking_policy."
              continue
            fi

            if ! git show "$results_ref:$source_path" > "$input_report" 2>/dev/null || [ ! -s "$input_report" ]; then
              echo "Skipping $output_directory: completed report is missing."
              continue
            fi

            jq -e '.context.totalCost == 100' "$input_report" >/dev/null
            node scripts/rerank-metagame-v12-report.mjs \
              --report="$input_report" \
              --output="$output_report" \
              --csv="$output_csv"
            jq -e --arg policy "$ranking_policy" '.rankingPolicy == $policy' "$output_report" >/dev/null
            printf '%s\n' "$output_directory" >> "$reranked_file"
          done

          if [ ! -s "$reranked_file" ]; then
            echo "No completed cost100 reports are currently available to rerank."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "$results_ref"
          git switch -C "$results_branch"

          while IFS= read -r output_directory; do
            output_path="$report_root/$output_directory"
            cp "$work_root/output/$output_directory-report.json" "$output_path/report.json"
            cp "$work_root/output/$output_directory-ranking.csv" "$output_path/ranking.csv"
            printf '%s\n' "$ranking_policy" > "$output_path/ranking-policy.txt"
          done < "$reranked_file"

          provenance="$report_root/recompute-provenance.json"
          if [ -f "$provenance" ]; then
            tmp="$RUNNER_TEMP/recompute-provenance.json"
            jq --arg policy "$ranking_policy" '.rankingPolicy = $policy' "$provenance" > "$tmp"
            mv "$tmp" "$provenance"
          fi

          git add -f "$report_root"
          if git diff --cached --quiet; then
            echo "Completed cost100 reports already use $ranking_policy."
            exit 0
          fi

          git commit -m "chore: rerank completed V12 cost100 reports"
          git push --force-with-lease=refs/heads/$results_branch origin HEAD:$results_branch

      - name: Resume the next incomplete V12 restriction
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Resuming V12 queue after lightweight rerank."
          gh workflow run metagame-v12-shared-pool-recompute.yml             --repo "${GITHUB_REPOSITORY}"             --ref master
\t' read -r run_id run_sha; do
                  [ -n "$run_id" ] || continue
                  if git merge-base --is-ancestor "$writer_lock_barrier" "$run_sha" 2>/dev/null; then
                    continue
                  fi
                  legacy_runs+=("$run_id")
                done < <(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<< "$runs_json")
              done
            done

            if [ "${#legacy_runs[@]}" -eq 0 ]; then
              echo "No pre-writer-lock V12 result writer remains active."
              break
            fi
            if [ "$attempt" -eq 80 ]; then
              echo "::error::Legacy V12 writer run(s) are still active: ${legacy_runs[*]}"
              exit 1
            fi
            echo "Waiting for legacy V12 writer run(s) to finish: ${legacy_runs[*]}"
            sleep 15
          done
      - name: Re-rank completed cost100 reports from existing battle evidence
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          report_root="reports/metagame-ratings-v12-team-opportunity"
          ranking_policy="full-budget-opportunity-v6-cost-weighted-slot"
          git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"

          groups=(
            "fire-100"
            "water-100"
            "wind-100"
            "fire-water-100"
            "fire-wind-100"
            "water-wind-100"
            "fire-water-wind-100"
          )

          work_root="$RUNNER_TEMP/v12-cost100-rerank"
          mkdir -p "$work_root/input" "$work_root/output"
          reranked_file="$work_root/reranked-groups.txt"
          : > "$reranked_file"

          for output_directory in "${groups[@]}"; do
            input_report="$work_root/input/$output_directory-report.json"
            output_report="$work_root/output/$output_directory-report.json"
            output_csv="$work_root/output/$output_directory-ranking.csv"
            source_path="$report_root/$output_directory/report.json"
            progress_path="$report_root/$output_directory/progress.json"
            marker_path="$report_root/$output_directory/ranking-policy.txt"
            input_id="${output_directory%-100}:100"
            marker="$(git show "$results_ref:$marker_path" 2>/dev/null || true)"

            if ! git show "$results_ref:$progress_path" 2>/dev/null | jq -e --arg input_id "$input_id" '
              .status == "complete"
              and .context.inputId == $input_id
              and .context.version == "team-battle-v12.5-effective-damage-individual-rank"
              and .context.battleSemantics == "opportunity-baseline-v5-effective-damage"
              and .finalizationState.version == 2
            ' >/dev/null 2>&1; then
              echo "Skipping $output_directory: current completed cost100 checkpoint is not available yet."
              continue
            fi
            if [ "$marker" = "$ranking_policy" ]; then
              echo "Skipping $output_directory: ranking already uses $ranking_policy."
              continue
            fi

            if ! git show "$results_ref:$source_path" > "$input_report" 2>/dev/null || [ ! -s "$input_report" ]; then
              echo "Skipping $output_directory: completed report is missing."
              continue
            fi

            jq -e '.context.totalCost == 100' "$input_report" >/dev/null
            node scripts/rerank-metagame-v12-report.mjs \
              --report="$input_report" \
              --output="$output_report" \
              --csv="$output_csv"
            jq -e --arg policy "$ranking_policy" '.rankingPolicy == $policy' "$output_report" >/dev/null
            printf '%s\n' "$output_directory" >> "$reranked_file"
          done

          if [ ! -s "$reranked_file" ]; then
            echo "No completed cost100 reports are currently available to rerank."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "$results_ref"
          git switch -C "$results_branch"

          while IFS= read -r output_directory; do
            output_path="$report_root/$output_directory"
            cp "$work_root/output/$output_directory-report.json" "$output_path/report.json"
            cp "$work_root/output/$output_directory-ranking.csv" "$output_path/ranking.csv"
            printf '%s\n' "$ranking_policy" > "$output_path/ranking-policy.txt"
          done < "$reranked_file"

          provenance="$report_root/recompute-provenance.json"
          if [ -f "$provenance" ]; then
            tmp="$RUNNER_TEMP/recompute-provenance.json"
            jq --arg policy "$ranking_policy" '.rankingPolicy = $policy' "$provenance" > "$tmp"
            mv "$tmp" "$provenance"
          fi

          git add -f "$report_root"
          if git diff --cached --quiet; then
            echo "Completed cost100 reports already use $ranking_policy."
            exit 0
          fi

          git commit -m "chore: rerank completed V12 cost100 reports"
          git push --force-with-lease=refs/heads/$results_branch origin HEAD:$results_branch

      - name: Resume the next incomplete V12 restriction
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Resuming V12 queue after lightweight rerank."
          gh workflow run metagame-v12-shared-pool-recompute.yml             --repo "${GITHUB_REPOSITORY}"             --ref master
