name: Apply skill and revive fix

on:
  push:
    branches:
      - fix/skill-targeting-revive-prediction

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-targeting-revive-prediction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused fixes
        run: node scripts/apply-skill-revive-fix.mjs
      - name: Syntax checks
        run: |
          node --check src/core/simulate.js
          node --check src/core/skills.js
          node --check test/skill-use-revive-regression.test.js
          python -m py_compile scripts/convert_workbook.py
      - name: Focused regression tests
        run: node --test test/skill-use-revive-regression.test.js test/skills.test.js test/attack-mode-target-routing.test.js
      - name: Commit fixes to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/simulate.js src/core/skills.js scripts/convert_workbook.py test/skill-use-revive-regression.test.js scripts/apply-skill-revive-fix.mjs .github/workflows/apply-skill-revive-fix.yml
          git commit -m "fix: respect skill attributes and improve revive prediction"
          git push origin HEAD:fix/skill-targeting-revive-prediction
