name: Metagame V12 blind Cost200 budget-neutral recovery

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/metagame-v12-blind-cost200-budget-neutral-recovery.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: metagame-v12-blind-cost200-budget-neutral-recovery
  cancel-in-progress: true

jobs:
  generate_all:
    name: recover generate (fire-water-wind)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Cost100 evidence only
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          git fetch --no-tags --depth=1 origin "+refs/heads/$results_branch:$results_ref"
          mkdir -p "$RUNNER_TEMP/blind-source"
          git show "$results_ref:reports/metagame-ratings-v12-team-opportunity/fire-water-wind-100/report.json"             > "$RUNNER_TEMP/blind-source/report-100.json"
          test "$(jq -r '.context.totalCost' "$RUNNER_TEMP/blind-source/report-100.json")" = "100"
      - name: Generate three-attribute Cost200 with larger heap
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blind-output"
          node scripts/run-metagame-v12-blind-cost200-test.mjs             --mode=generate             --attribute=fire-water-wind             --source-report="$RUNNER_TEMP/blind-source/report-100.json"             --output="$RUNNER_TEMP/blind-output/fire-water-wind.json"             --beam-width=16000             --candidate-limit=280             --rounds=3             --scenario-count=18
      - uses: actions/upload-artifact@v4
        with:
          name: blind-cost200-fire-water-wind-recovered-v2
          path: ${{ runner.temp }}/blind-output/fire-water-wind.json
          if-no-files-found: error
          retention-days: 7

  compare_other:
    name: compare recovered field (${{ matrix.attribute }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        attribute:
          - fire
          - water
          - wind
          - fire-water
          - fire-wind
          - water-wind
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: blind-cost200-${{ matrix.attribute }}
          path: ${{ runner.temp }}/blind-output
          run-id: 40409594309
          github-token: ${{ github.token }}
      - name: Reveal Cost200 truth after generation
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          git fetch --no-tags --depth=1 origin "+refs/heads/$results_branch:$results_ref"
          mkdir -p "$RUNNER_TEMP/blind-truth" "$RUNNER_TEMP/blind-metrics"
          git show "$results_ref:reports/metagame-ratings-v12-team-opportunity/${{ matrix.attribute }}-200/report.json"             > "$RUNNER_TEMP/blind-truth/report-200.json"
          node scripts/run-metagame-v12-blind-cost200-test.mjs             --mode=compare             --attribute="${{ matrix.attribute }}"             --blind="$RUNNER_TEMP/blind-output/${{ matrix.attribute }}.json"             --truth-report="$RUNNER_TEMP/blind-truth/report-200.json"             --output="$RUNNER_TEMP/blind-metrics/${{ matrix.attribute }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: blind-cost200-metrics-v2-${{ matrix.attribute }}
          path: ${{ runner.temp }}/blind-metrics/${{ matrix.attribute }}.json
          if-no-files-found: error
          retention-days: 7

  compare_all:
    name: compare recovered field (fire-water-wind)
    needs: generate_all
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: blind-cost200-fire-water-wind-recovered-v2
          path: ${{ runner.temp }}/blind-output
      - name: Reveal Cost200 truth after generation
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          git fetch --no-tags --depth=1 origin "+refs/heads/$results_branch:$results_ref"
          mkdir -p "$RUNNER_TEMP/blind-truth" "$RUNNER_TEMP/blind-metrics"
          git show "$results_ref:reports/metagame-ratings-v12-team-opportunity/fire-water-wind-200/report.json"             > "$RUNNER_TEMP/blind-truth/report-200.json"
          node scripts/run-metagame-v12-blind-cost200-test.mjs             --mode=compare             --attribute=fire-water-wind             --blind="$RUNNER_TEMP/blind-output/fire-water-wind.json"             --truth-report="$RUNNER_TEMP/blind-truth/report-200.json"             --output="$RUNNER_TEMP/blind-metrics/fire-water-wind.json"
      - uses: actions/upload-artifact@v4
        with:
          name: blind-cost200-metrics-v2-fire-water-wind
          path: ${{ runner.temp }}/blind-metrics/fire-water-wind.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: aggregate corrected blind Cost200 result
    needs:
      - compare_other
      - compare_all
    if: needs.compare_other.result == 'success' && needs.compare_all.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: blind-cost200-metrics-v2-*
          merge-multiple: true
          path: ${{ runner.temp }}/blind-metrics
      - name: Aggregate corrected result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blind-summary"
          node scripts/run-metagame-v12-blind-cost200-test.mjs             --mode=aggregate             --input-directory="$RUNNER_TEMP/blind-metrics"             --output="$RUNNER_TEMP/blind-summary/latest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: blind-cost200-summary-v2
          path: ${{ runner.temp }}/blind-summary/latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist corrected result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="metagame-v12-blind-test-results"
          git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch -C "$branch" "refs/remotes/origin/$branch"
          else
            git switch -C "$branch" origin/master
          fi
          mkdir -p reports/metagame-v12-blind-cost200
          cp "$RUNNER_TEMP/blind-summary/latest.json" reports/metagame-v12-blind-cost200/latest-budget-neutral.json
          git add -f reports/metagame-v12-blind-cost200/latest-budget-neutral.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: save corrected blind Cost200 result"
            git push origin HEAD:"$branch"
          fi
