name: Diagnose fire100 V8 ranking

on:
  push:
    branches:
      - diagnose-fire100-v8-ranking
    paths:
      - ".github/workflows/diagnose-fire100-v8-ranking.yml"

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose-fire100-v8-ranking
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print selected fire100 character data
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import * as mod from "./src/data/workbook-characters.js";
          const wanted = new Set([
            "エーランドちゃん","Let's☆ハチ公","製鉄所★澤先輩",
            "カム着火べあぱわー","帝王ヒルズ様","カルボ姉（ねえ）",
            "漆黒及び純白のポワン","牛タソ☆行進曲","称えよ☆メジェド様！",
            "パプアさん","腹話フック","聖☆いんてぃないか","ズンビーフック",
            "巨大カンテツ","いーびルン","ネオけいび"
          ]);
          const found = new Map();
          const seen = new Set();
          function walk(v) {
            if (!v || typeof v !== "object" || seen.has(v)) return;
            seen.add(v);
            if (typeof v.name === "string" && wanted.has(v.name)) found.set(v.name, v);
            if (Array.isArray(v)) for (const x of v) walk(x);
            else for (const x of Object.values(v)) walk(x);
          }
          for (const v of Object.values(mod)) walk(v);
          console.log("CHAR_DATA_BEGIN");
          for (const name of wanted) {
            const c = found.get(name);
            console.log(JSON.stringify(c ? {
              id:c.id,name:c.name,attributes:c.attributes,rarity:c.rarity,cost:c.cost,hp:c.hp,pow:c.pow,
              skillTurn:c.skillTurn,maxUses:c.maxUses,skill:c.skill
            } : {name,missing:true}, null, 0));
          }
          console.log("CHAR_DATA_END");
          JS
