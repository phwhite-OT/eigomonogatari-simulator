name: Metagame V12 blind Cost200 all-attribute comparison recovery

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/metagame-v12-blind-cost200-all-recovery.yml"

permissions:
  contents: write
  actions: read

jobs:
  compare_all:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: blind-cost200-fire-water-wind
          path: ${{ runner.temp }}/blind-output
          run-id: 40321784263
          github-token: ${{ github.token }}
      - name: Patch legacy all:200 alias in recovery workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/run-metagame-v12-blind-cost200-test.mjs")
          s = p.read_text()
          old = 'const exactInput = METAGAME_V8_COST_200_INPUTS.find((entry) => String(entry.id) === `${attributeKey}:200`);'
          new = 'const truthInputId = attributeKey === "fire-water-wind" ? "all:200" : `${attributeKey}:200`;\n  const exactInput = METAGAME_V8_COST_200_INPUTS.find((entry) => String(entry.id) === truthInputId);'
          if old not in s:
              raise SystemExit("expected compare lookup not found")
          p.write_text(s.replace(old, new))
          PY
          node --check scripts/run-metagame-v12-blind-cost200-test.mjs
      - name: Reveal all:200 truth and compare
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          git fetch --no-tags --depth=1 origin "+refs/heads/$results_branch:$results_ref"
          mkdir -p "$RUNNER_TEMP/blind-truth" "$RUNNER_TEMP/blind-metrics"
          git show "$results_ref:reports/metagame-ratings-v12-team-opportunity/fire-water-wind-200/report.json"             > "$RUNNER_TEMP/blind-truth/report-200.json"
          node scripts/run-metagame-v12-blind-cost200-test.mjs             --mode=compare             --attribute=fire-water-wind             --blind="$RUNNER_TEMP/blind-output/fire-water-wind.json"             --truth-report="$RUNNER_TEMP/blind-truth/report-200.json"             --output="$RUNNER_TEMP/blind-metrics/fire-water-wind.json"
      - uses: actions/upload-artifact@v4
        with:
          name: blind-cost200-metrics-fire-water-wind-recovered
          path: ${{ runner.temp }}/blind-metrics/fire-water-wind.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: compare_all
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the six original comparisons to finish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            running="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/40321784263/jobs?per_page=100               --jq '[.jobs[] | select(.name | startswith("blind-compare (")) | select(.name != "blind-compare (fire-water-wind)") | select(.status != "completed")] | length')"
            failed="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/40321784263/jobs?per_page=100               --jq '[.jobs[] | select(.name | startswith("blind-compare (")) | select(.name != "blind-compare (fire-water-wind)") | select(.status == "completed" and .conclusion != "success")] | length')"
            if [ "$failed" -gt 0 ]; then
              echo "Another comparison failed; stop recovery aggregation." >&2
              exit 1
            fi
            if [ "$running" -eq 0 ]; then
              exit 0
            fi
            sleep 20
          done
          echo "Original comparisons did not finish inside recovery wait window." >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: blind-cost200-metrics-*
          path: ${{ runner.temp }}/blind-metrics
          merge-multiple: true
          run-id: 40321784263
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: blind-cost200-metrics-fire-water-wind-recovered
          path: ${{ runner.temp }}/blind-metrics
      - name: Aggregate recovered seven-condition result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blind-summary"
          node scripts/run-metagame-v12-blind-cost200-test.mjs             --mode=aggregate             --input-directory="$RUNNER_TEMP/blind-metrics"             --output="$RUNNER_TEMP/blind-summary/latest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: blind-cost200-summary-recovered
          path: ${{ runner.temp }}/blind-summary/latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist recovered blind-test result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="metagame-v12-blind-test-results"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git switch -C "$branch" "refs/remotes/origin/$branch"
          else
            git switch -C "$branch" origin/master
          fi
          mkdir -p reports/metagame-v12-blind-cost200
          cp "$RUNNER_TEMP/blind-summary/latest.json" reports/metagame-v12-blind-cost200/latest.json
          git add -f reports/metagame-v12-blind-cost200/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: save recovered blind Cost200 result"
            git push origin HEAD:"$branch"
          fi
