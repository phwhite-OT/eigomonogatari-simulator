name: V12 threshold proxy patcher

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  patch:
    if: github.head_ref == 'fix/v12-threshold-proxy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v12-threshold-proxy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate threshold proxy branch
        run: |
          node --check src/core/metagame-v7.js
          node --check src/core/metagame-v12.js
          node --test test/metagame-v12.test.js
