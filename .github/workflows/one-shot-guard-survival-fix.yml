name: One-shot guard survival AI fix

on:
  push:
    paths:
      - .github/workflows/one-shot-guard-survival-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch guard decision semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/core/simulate.js')
          text = path.read_text()

          anchor = '''function expertSupportBenefit(state, side, actorIndex, skill, rules) {
            const after = applySupportSkill(state, side, actorIndex, skill, { consumeSkill: false });
            const outgoingGain = projectedTeamAttackDamage(after, side, rules) - projectedTeamAttackDamage(state, side, rules);
            const preventedDamage = crossTeamDamage(state, opponentSide(side), rules) - crossTeamDamage(after, opponentSide(side), rules);
            const healingGain = totalCurrentHp(after, side) - totalCurrentHp(state, side);
            return { after, outgoingGain, preventedDamage, healingGain };
          }
          '''
          helper = anchor + '''
          function activeCombatantCount(state, side) {
            return state[side].filter((combatant) => combatant.alive && !combatant.isGhost).length;
          }

          function expertDefenseSurvivalBenefit(state, side, actorIndex, skill, rules, options = {}) {
            if (!DEFENSE_SKILL_TYPES.has(skill.type)) {
              return { survivorGain: 0, savedAllyCount: 0, sacrificedAllyCount: 0 };
            }
            const plannedIntents = Array.isArray(options.plannedIntents) ? options.plannedIntents : [];
            const baselineIntents = plannedIntents.filter((intent) => !(
              intent.side === side &&
              intent.actorIndex === actorIndex &&
              DEFENSE_SKILL_TYPES.has(intent.skill?.type)
            ));
            const actor = state[side]?.[actorIndex];
            const candidateIntent = {
              side,
              actorIndex,
              actorId: actor?.activeCharacterId,
              actorName: actor?.character?.name,
              skill: structuredClone(skill),
              use: true,
            };
            const before = predictedAttackPhaseState(state, side, rules, {
              ...options,
              plannedIntents: baselineIntents,
            });
            const after = predictedAttackPhaseState(state, side, rules, {
              ...options,
              plannedIntents: [...baselineIntents, candidateIntent],
            });
            if (!before || !after) {
              return { survivorGain: 0, savedAllyCount: 0, sacrificedAllyCount: 0 };
            }

            let savedAllyCount = 0;
            let sacrificedAllyCount = 0;
            for (let index = 0; index < state[side].length; index += 1) {
              const original = state[side][index];
              if (!original?.alive || original.isGhost) continue;
              const aliveBefore = Boolean(before[side]?.[index]?.alive && !before[side]?.[index]?.isGhost);
              const aliveAfter = Boolean(after[side]?.[index]?.alive && !after[side]?.[index]?.isGhost);
              if (!aliveBefore && aliveAfter) savedAllyCount += 1;
              if (aliveBefore && !aliveAfter) sacrificedAllyCount += 1;
            }
            return {
              survivorGain: activeCombatantCount(after, side) - activeCombatantCount(before, side),
              savedAllyCount,
              sacrificedAllyCount,
            };
          }
          '''
          if anchor not in text:
            raise SystemExit('expertSupportBenefit anchor not found')
          text = text.replace(anchor, helper, 1)

          decision_anchor = '''  if (ATTACK_MODE_TYPES.has(skill.type)) {
          '''
          defense_branch = '''  if (DEFENSE_SKILL_TYPES.has(skill.type)) {
            const benefit = expertSupportBenefit(state, side, actorIndex, skill, rules);
            const survival = expertDefenseSurvivalBenefit(state, side, actorIndex, skill, rules, options);
            if (survival.survivorGain > 0) {
              return {
                use: true,
                reason: `実際の敵攻撃を予行すると、かばう・防御により生存中の味方が純増${survival.survivorGain}体（撃破回避${survival.savedAllyCount}体）になるため使用`,
              };
            }
            if (benefit.preventedDamage > 0) {
              return {
                use: true,
                reason: `実際の被ダメージを${benefit.preventedDamage}軽減できるため使用`,
              };
            }
            return {
              use: false,
              reason: "実際の攻撃配分を予行しても生存人数・被ダメージが改善しないため温存",
            };
          }
          ''' + decision_anchor
          if decision_anchor not in text:
            raise SystemExit('attack mode decision anchor not found')
          text = text.replace(decision_anchor, defense_branch, 1)
          path.write_text(text)

          test_path = Path('test/team-battle-ai-regression.test.js')
          tests = test_path.read_text()
          marker = 'expert guard uses sacrificial cover when it preserves more active allies'
          if marker not in tests:
            tests += '''

          test("expert guard uses sacrificial cover when it preserves more active allies", () => {
            const guardSkill = {
              type: "guard",
              multiplier: 1,
              duration: 1,
              hits: 1,
              target: "self",
              conditions: [],
            };
            const state = createBattleState(
              [
                character("protector", { hp: 250, pow: 0, skillTurn: 0, skill: guardSkill }),
                character("ally-a", { hp: 80, pow: 0 }),
                character("ally-b", { hp: 80, pow: 0 }),
                character("ally-c", { hp: 80, pow: 0 }),
                character("ally-d", { hp: 80, pow: 0 }),
              ],
              [
                character("enemy-a", { hp: 10_000, pow: 100 }),
                character("enemy-b", { hp: 10_000, pow: 100 }),
                character("enemy-c", { hp: 10_000, pow: 100 }),
                character("enemy-d", { hp: 10_000, pow: 100 }),
                character("enemy-e", { hp: 10_000, pow: 100 }),
              ],
            );
            const result = simulateBattle(state, rules(), {
              turns: 1,
              targetPolicy: TARGET_POLICIES.EXPERT,
              attackOrderPolicy: ATTACK_ORDER_POLICIES.TACTICAL,
              playStyle: PLAY_STYLES.EXPERT,
            });
            const selection = result.history[0].phases.find((phase) => phase.id === "skill_selection");
            const protectorDecision = selection.events.find((event) => event.actorName === "protector");

            assert.equal(protectorDecision.type, "skill_use");
            assert.match(protectorDecision.reason, /生存中の味方が純増/);
            assert.ok(result.history[0].allies.activePlayers >= 2);
          });

          test("expert guard stays held when redirecting attacks saves nobody", () => {
            const guardSkill = {
              type: "guard",
              multiplier: 1,
              duration: 1,
              hits: 1,
              target: "self",
              conditions: [],
            };
            const state = createBattleState(
              [
                character("protector", { hp: 1_000, pow: 0, skillTurn: 0, skill: guardSkill }),
                character("ally-a", { hp: 1_000, pow: 0 }),
                character("ally-b", { hp: 1_000, pow: 0 }),
              ],
              [
                character("enemy-a", { hp: 10_000, pow: 100 }),
                character("enemy-b", { hp: 10_000, pow: 100 }),
              ],
            );
            const result = simulateBattle(state, rules(), {
              turns: 1,
              targetPolicy: TARGET_POLICIES.EXPERT,
              attackOrderPolicy: ATTACK_ORDER_POLICIES.TACTICAL,
              playStyle: PLAY_STYLES.EXPERT,
            });
            const selection = result.history[0].phases.find((phase) => phase.id === "skill_selection");
            const protectorDecision = selection.events.find((event) => event.actorName === "protector");

            assert.equal(protectorDecision.type, "skill_hold");
            assert.match(protectorDecision.reason, /生存人数・被ダメージが改善しない/);
          });
          '''
            test_path.write_text(tests)

          semantics_old = 'skill-target-revive-v2'
          semantics_new = 'skill-target-revive-guard-survival-v3'
          for filename in [
            'scripts/rate-metagame-v12.mjs',
            '.github/workflows/metagame-v12-shared-pool-recompute.yml',
          ]:
            p = Path(filename)
            value = p.read_text()
            if semantics_old not in value:
              raise SystemExit(f'{semantics_old} not found in {filename}')
            p.write_text(value.replace(semantics_old, semantics_new))
          PY
      - name: Run focused regressions
        run: node --test test/team-battle-ai-regression.test.js test/skill-use-revive-regression.test.js test/v12-battle-corrections.test.js
      - name: Run full test suite
        run: npm test
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-guard-survival-fix.yml
          git add src/core/simulate.js test/team-battle-ai-regression.test.js scripts/rate-metagame-v12.mjs .github/workflows/metagame-v12-shared-pool-recompute.yml
          git commit -m "fix: value guard skills by allies saved"
          git push origin HEAD:master
