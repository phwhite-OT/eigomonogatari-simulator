name: Start Metagame V12

# Trigger marker: 2026-08-24T15:04+09:00
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/start-v12.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older V12 evaluator runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run list --workflow metagame-v12-cloud.yml --repo "${{ github.repository }}" --limit 30 --json databaseId,status \
            --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            gh run cancel "$run_id" --repo "${{ github.repository }}" || true
          done
      - name: Start corrected V12.1 evaluator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run metagame-v12-cloud.yml --repo "${{ github.repository }}" --ref master
