name: Start Metagame V12

# Trigger marker: 2026-08-24T14:23+09:00
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/start-v12.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Apply V12.1 correctness fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-v12-1-correctness-fixes.yml --repo "${{ github.repository }}" --ref master
