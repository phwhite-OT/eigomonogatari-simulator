name: Metagame V12 shared-pool full recompute

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/core/simulate.js"
      - "src/core/skills.js"
      - "src/core/metagame-v7.js"
      - "src/core/metagame-v12.js"
      - "src/core/metagame-v12-finalization.js"
      - "src/core/metagame-v12-shared-pool.js"
      - "scripts/rate-metagame-v12.mjs"
      - "src/data/metagame-v8-inputs.js"
      - "src/data/metagame-v12-sweep-inputs.js"
      - ".github/workflows/metagame-v12-shared-pool-recompute.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: metagame-v12-shared-pool-recompute
  # A source push replaces obsolete calculations. Normal candidate recompute
  # and distributed finalization otherwise serialize through the same group so
  # they cannot race while writing the durable results branch.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      work_matrix: ${{ steps.next.outputs.work_matrix }}
      targets: ${{ steps.next.outputs.targets }}
      all_completed: ${{ steps.next.outputs.all_completed }}
      recovery_only: ${{ steps.next.outputs.recovery_only }}
      rerank_only: ${{ steps.next.outputs.rerank_only }}
      handoff_finalizing: ${{ steps.next.outputs.handoff_finalizing }}
      recovery_run_id: ${{ steps.next.outputs.recovery_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: next
        name: Select the next incomplete recompute environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          ranking_policy="matched-slot-counterfactual-v3-resumable"
          if [ -n "$(git ls-remote --heads origin "$results_branch")" ]; then
            git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"
          fi

          has_current_ranking() {
            local output_directory="$1"
            local marker
            marker="$(git show "$results_ref:reports/metagame-ratings-v12-team-opportunity/${output_directory}/ranking-policy.txt" 2>/dev/null || true)"
            [ "$marker" = "$ranking_policy" ]
          }

          is_current_complete() {
            local progress_path="$1"
            local output_directory="$2"
            local progress
            progress="$(git show "$results_ref:$progress_path" 2>/dev/null || true)"
            [ -n "$progress" ] && \
              jq -e '.status == "complete" and .context.version == "team-battle-v12.4-full-opportunity-baseline" and .context.battleSemantics == "opportunity-baseline-v4"' <<< "$progress" >/dev/null 2>&1 && \
              has_current_ranking "$output_directory"
          }

          find_recovery_run() {
            local output_directory="$1"
            local runs_json run_id artifacts_json prefix
            prefix="v12-sp-progress-${output_directory}-"
            runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/metagame-v12-shared-pool-recompute.yml/runs?per_page=30" 2>/dev/null || true)"
            [ -n "$runs_json" ] || return 1
            while IFS= read -r run_id; do
              artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" 2>/dev/null || true)"
              [ -n "$artifacts_json" ] || continue
              if jq -e --arg prefix "$prefix" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | length > 0' <<< "$artifacts_json" >/dev/null; then
                echo "$run_id"
                return 0
              fi
            done < <(jq -r --argjson current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.id != $current) | .id' <<< "$runs_json")
            return 1
          }

          attribute_groups=(
            "fire" "water" "wind"
            "fire-water" "fire-wind" "water-wind" "fire-water-wind"
          )
          representative_costs=(100 200 300 500)
          input_ids=()
          for cost in "${representative_costs[@]}"; do
            for attribute_group in "${attribute_groups[@]}"; do
              input_ids+=("${attribute_group}:${cost}")
            done
          done

          echo "V12 precompute queue: ${#input_ids[@]} conditions (7 attribute groups x representative costs 100,200,300,500)."
          targets='[]'
          checkpoint_path=""
          checkpoint_exists=false
          output_directory=""
          for input_id in "${input_ids[@]}"; do
            output_directory="${input_id//:/-}"
            progress_path="reports/metagame-ratings-v12-team-opportunity/$output_directory/progress.json"
            if is_current_complete "$progress_path" "$output_directory"; then
              continue
            fi
            targets="$(jq -c --arg input "$input_id" --arg output_directory "$output_directory" '. + [{input:$input,output_directory:$output_directory}]' <<< "$targets")"
            checkpoint_path="$RUNNER_TEMP/v12-sp-selection/$output_directory-progress.json"
            mkdir -p "$(dirname "$checkpoint_path")"
            if git show "$results_ref:$progress_path" > "$checkpoint_path" 2>/dev/null && [ -s "$checkpoint_path" ]; then
              checkpoint_exists=true
            else
              rm -f "$checkpoint_path"
            fi
            break
          done

          recovery_only=false
          rerank_only=false
          handoff_finalizing=false
          recovery_run_id=""

          if [ "$targets" = '[]' ]; then
            work_matrix='{"include":[]}'
            echo "all_completed=true" >> "$GITHUB_OUTPUT"
          else
            input_id="$(jq -r '.[0].input' <<< "$targets")"

            # Finalization is intentionally owned by the 19-runner fanout. The
            # old normal workflow used to spend two hours here with only four
            # local workers, repeatedly starving the pending fanout workflow.
            if [ "$checkpoint_exists" = true ] && \
               jq -e '.status == "finalizing" and .context.version == "team-battle-v12.4-full-opportunity-baseline" and .context.battleSemantics == "opportunity-baseline-v4" and .finalizationState.phase == "counterfactual"' "$checkpoint_path" >/dev/null 2>&1; then
              handoff_finalizing=true
              work_matrix='{"include":[]}'
              echo "Handing $input_id directly to distributed finalization; normal recompute will not run serial counterfactual battles."
            elif [ "$checkpoint_exists" = true ] && \
                 jq -e '.status == "complete" and .context.version == "team-battle-v12.4-full-opportunity-baseline" and .context.battleSemantics == "opportunity-baseline-v4"' "$checkpoint_path" >/dev/null 2>&1 && \
                 ! has_current_ranking "$output_directory"; then
              rerank_only=true
              work_matrix='{"include":[]}'
              echo "Refreshing $input_id ranking policy from its completed checkpoint."
            else
              if [ "$checkpoint_exists" != true ]; then
                recovery_run_id="$(find_recovery_run "$output_directory" || true)"
              fi
              if [ -n "$recovery_run_id" ]; then
                recovery_only=true
                work_matrix='{"include":[]}'
                echo "Recovering $input_id from workflow run $recovery_run_id artifacts."
              else
                work_matrix="$(node scripts/build-metagame-v12-work-matrix.mjs --input="$input_id" --checkpoint-path="$checkpoint_path" --max-workers=20)"
                if [ "$(jq -r '.include | length' <<< "$work_matrix")" -eq 0 ]; then
                  echo "No candidate shards selected for incomplete input $input_id" >&2
                  exit 1
                fi
              fi
            fi
            echo "all_completed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "recovery_only=$recovery_only" >> "$GITHUB_OUTPUT"
          echo "rerank_only=$rerank_only" >> "$GITHUB_OUTPUT"
          echo "handoff_finalizing=$handoff_finalizing" >> "$GITHUB_OUTPUT"
          echo "recovery_run_id=$recovery_run_id" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "work_matrix=$work_matrix" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: select
    if: needs.select.outputs.all_completed != 'true' && needs.select.outputs.recovery_only != 'true' && needs.select.outputs.rerank_only != 'true' && needs.select.outputs.handoff_finalizing != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix: ${{ fromJSON(needs.select.outputs.work_matrix) }}
    env:
      METAGAME_TIME_BUDGET_SECONDS: "8400"
      METAGAME_INPUT: ${{ matrix.input }}
      METAGAME_OUTPUT_DIRECTORY: ${{ matrix.output_directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore shared-pool recompute progress
        shell: bash
        run: |
          checkpoint_path="$RUNNER_TEMP/v12-sp-progress/${METAGAME_OUTPUT_DIRECTORY}-position-${{ matrix.position }}-shard-${{ matrix.shard }}.json"
          mkdir -p "$(dirname "$checkpoint_path")"
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          if [ -n "$(git ls-remote --heads origin "$results_branch")" ]; then
            git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"
          fi
          progress_path="reports/metagame-ratings-v12-team-opportunity/${METAGAME_OUTPUT_DIRECTORY}/progress.json"
          if ! git show "$results_ref:$progress_path" > "$checkpoint_path" 2>/dev/null || [ ! -s "$checkpoint_path" ]; then
            rm -f "$checkpoint_path"
          fi
      - id: rate
        name: Recompute V12 candidate shard
        continue-on-error: true
        run: |
          node scripts/rate-metagame-v12.mjs \
            --input="$METAGAME_INPUT" \
            --position=${{ matrix.position }} \
            --candidate-indices="${{ matrix.candidate_indices }}" \
            --checkpoint-path="$RUNNER_TEMP/v12-sp-progress/${METAGAME_OUTPUT_DIRECTORY}-position-${{ matrix.position }}-shard-${{ matrix.shard }}.json" \
            --time-budget-seconds="$METAGAME_TIME_BUDGET_SECONDS"
      - name: Upload recompute shard progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-sp-progress-${{ matrix.output_directory }}-${{ matrix.position }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/v12-sp-progress/${{ matrix.output_directory }}-position-${{ matrix.position }}-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Propagate evaluation failure after checkpoint upload
        if: always() && steps.rate.outcome == 'failure'
        run: exit 1

  publish:
    needs: [select, evaluate]
    if: always() && needs.select.outputs.all_completed != 'true' && needs.select.outputs.handoff_finalizing != 'true'
    runs-on: ubuntu-latest
    env:
      # Normal recompute only creates/refreshes the durable finalization state.
      # Expensive counterfactual/deep-neighbourhood battles belong to fanout.
      FINALIZE_TIME_BUDGET_SECONDS: "120"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore isolated recompute snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          if [ -n "$(git ls-remote --heads origin "$results_branch")" ]; then
            git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"
          fi
          git switch --detach "${{ github.sha }}"
          if git cat-file -e "$results_ref:reports/metagame-ratings-v12-team-opportunity" 2>/dev/null; then
            git checkout "$results_ref" -- reports/metagame-ratings-v12-team-opportunity
          fi
          git switch --create "$results_branch"
      - name: Download current-run shard checkpoints
        if: needs.select.outputs.recovery_only != 'true' && needs.select.outputs.rerank_only != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: v12-sp-progress-*
          merge-multiple: true
          path: ${{ runner.temp }}/v12-sp-progress
      - name: Recover shard checkpoints from previous run
        if: needs.select.outputs.recovery_only == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: v12-sp-progress-*
          merge-multiple: true
          path: ${{ runner.temp }}/v12-sp-progress
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select.outputs.recovery_run_id }}
      - name: Merge selected environment checkpoints
        shell: bash
        env:
          TARGETS: ${{ needs.select.outputs.targets }}
          RERANK_ONLY: ${{ needs.select.outputs.rerank_only }}
        run: |
          set -euo pipefail
          ranking_policy="matched-slot-counterfactual-v3-resumable"
          while IFS= read -r target; do
            input="$(jq -r '.input' <<< "$target")"
            output_directory="$(jq -r '.output_directory' <<< "$target")"
            output_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}"
            checkpoint_path="${output_path}/progress.json"
            if [ "$RERANK_ONLY" = "true" ]; then
              echo "Refreshing completed checkpoint for $input; distributed fanout will own any expensive missing work."
              node scripts/rate-metagame-v12.mjs \
                --input="$input" \
                --position=all \
                --checkpoint-path="$checkpoint_path" \
                --time-budget-seconds="$FINALIZE_TIME_BUDGET_SECONDS" \
                --finalize-only=true
            else
              mapfile -t checkpoint_files < <(find "$RUNNER_TEMP/v12-sp-progress" -maxdepth 1 -type f -name "${output_directory}-position-*-shard-*.json" -print | sort)
              if [ "${#checkpoint_files[@]}" -eq 0 ]; then
                echo "No V12 recompute checkpoints downloaded for $input" >&2
                exit 1
              fi
              checkpoint_paths="$(IFS=,; echo "${checkpoint_files[*]}")"
              node scripts/rate-metagame-v12.mjs \
                --input="$input" \
                --position=all \
                --checkpoint-path="$checkpoint_path" \
                --merge-checkpoint-paths="$checkpoint_paths" \
                --time-budget-seconds="$FINALIZE_TIME_BUDGET_SECONDS" \
                --finalize-only=true
            fi

            if jq -e '.status == "complete"' "$checkpoint_path" >/dev/null; then
              printf '%s\n' "$ranking_policy" > "${output_path}/ranking-policy.txt"
              echo "Finalization complete for $input."
            else
              rm -f "${output_path}/ranking-policy.txt"
              echo "Finalization checkpoint persisted for $input; handing expensive work to distributed fanout."
            fi
          done < <(jq -c '.[]' <<< "$TARGETS")
      - name: Record recompute provenance
        shell: bash
        run: |
          mkdir -p reports/metagame-ratings-v12-team-opportunity
          jq -n \
            --arg source_commit "${{ github.sha }}" \
            --arg source_ref "${{ github.ref_name }}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              strategy:"shared-evaluated-deck-pool-representative-cost-precompute",
              sourceCommit:$source_commit,
              sourceRef:$source_ref,
              generatedAt:$generated_at,
              attributeGroups:["fire","water","wind","fire-water","fire-wind","water-wind","fire-water-wind"],
              representativeCosts:[100,200,300,500],
              intermediateCostPolicy:"compose from neighbouring precomputed cost bands during deck generation",
              rankingPolicy:"matched-slot-counterfactual-v3-resumable",
              conditionCount:28
            }' \
            > reports/metagame-ratings-v12-team-opportunity/recompute-provenance.json
      - id: status
        name: Check 28-condition recompute completion
        shell: bash
        run: |
          set -euo pipefail
          ranking_policy="matched-slot-counterfactual-v3-resumable"
          is_complete_file() {
            local progress_path="$1"
            local marker_path="$2"
            [ -f "$progress_path" ] && \
              jq -e '.status == "complete" and .context.version == "team-battle-v12.4-full-opportunity-baseline" and .context.battleSemantics == "opportunity-baseline-v4"' "$progress_path" >/dev/null && \
              [ -f "$marker_path" ] && [ "$(cat "$marker_path")" = "$ranking_policy" ]
          }
          attribute_groups=(
            "fire" "water" "wind"
            "fire-water" "fire-wind" "water-wind" "fire-water-wind"
          )
          representative_costs=(100 200 300 500)
          all_completed=true
          for cost in "${representative_costs[@]}"; do
            for attribute_group in "${attribute_groups[@]}"; do
              output_directory="${attribute_group}-${cost}"
              output_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}"
              if ! is_complete_file "${output_path}/progress.json" "${output_path}/ranking-policy.txt"; then
                all_completed=false
                break 2
              fi
            done
          done
          echo "all_completed=$all_completed" >> "$GITHUB_OUTPUT"
      - name: Save isolated recompute progress
        shell: bash
        run: |
          set -euo pipefail
          results_branch="metagame-v12-shared-pool-results"
          git add -f reports/metagame-ratings-v12-team-opportunity
          if ! git diff --cached --quiet; then
            git commit -m "chore: save V12 shared-pool recompute progress"
            if [ -n "$(git ls-remote --heads origin "$results_branch")" ]; then
              git push --force-with-lease=refs/heads/$results_branch origin HEAD:$results_branch
            else
              git push origin HEAD:$results_branch
            fi
          fi
      - name: Continue with distributed finalization or next candidate recompute
        if: steps.status.outputs.all_completed != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.select.outputs.targets }}
        run: |
          set -euo pipefail
          target="$(jq -c '.[0]' <<< "$TARGETS")"
          output_directory="$(jq -r '.output_directory' <<< "$target")"
          checkpoint_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}/progress.json"

          if [ -f "$checkpoint_path" ] && jq -e '.status == "finalizing"' "$checkpoint_path" >/dev/null 2>&1; then
            workflow="metagame-v12-finalization-fanout.yml"
            echo "Condition entered finalization; dispatching 19-runner distributed accelerator instead of another serial normal segment."
          else
            workflow="metagame-v12-shared-pool-recompute.yml"
            echo "Candidate recompute is still incomplete; scheduling the next normal segment."
          fi

          output=""
          delay=5
          for attempt in 1 2 3 4 5; do
            if output="$(gh workflow run "$workflow" --repo "${{ github.repository }}" --ref master 2>&1)"; then
              echo "V12 continuation dispatch accepted on attempt $attempt: $workflow"
              exit 0
            fi
            echo "V12 continuation dispatch attempt $attempt failed: $output" >&2
            if ! grep -Eqi 'HTTP (500|502|503|504)|Failed to run workflow dispatch|temporar|timeout|connection reset|service unavailable|bad gateway|gateway timeout' <<< "$output"; then
              echo "::error::Continuation dispatch failed with a non-transient error."
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          echo "::warning::Continuation dispatch still has a transient GitHub error after 5 attempts. Progress is safe and watchdog will retry."
          exit 0
