name: Apply V12 counterfactual fix

on:
  push:
    branches:
      - fix/v12-counterfactual-contribution
    paths:
      - ".github/workflows/apply-v12-counterfactual-fix.yml"
      - "scripts/apply-v12-counterfactual-fix.py"
      - "test/metagame-v12-counterfactual-contribution.test.js"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source edits
        run: python3 scripts/apply-v12-counterfactual-fix.py
      - name: Run focused V12 tests
        run: node --test test/metagame-v12-counterfactual-contribution.test.js test/metagame-v12-shared-pool.test.js test/metagame-v12-deck-first-ranking.test.js test/metagame-v12-dynamic-cost.test.js
      - name: Build public app
        run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-v12-counterfactual-fix.py patches/v12-counterfactual-contribution.patch .github/workflows/apply-v12-counterfactual-fix.yml
          git add -A
          git commit -m "fix: audit V12 characters with matched-slot replacements"
          git push origin HEAD:fix/v12-counterfactual-contribution
