name: Commit validated V12 evaluation repair

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/v12-commit-validated-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the already-diagnosed repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/v12-evaluation-repair.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, '<v12-repair>', 'exec'))
          PY
      - name: Validate affected behavior
        run: |
          set -euo pipefail
          node --check src/core/simulate.js
          node --check src/core/metagame-v12.js
          node --check scripts/rate-metagame-v12.mjs
          node --test \
            test/metagame-v12-individual-ranking.test.js \
            test/metagame-v12-deck-first-ranking.test.js \
            test/metagame-v12-counterfactual-contribution.test.js \
            test/v12-battle-corrections.test.js \
            test/simulate.test.js \
            test/team-battle-ai-regression.test.js \
            test/metagame-v12-shared-pool.test.js \
            test/metagame-v12-finalization.test.js
      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts test
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: use effective damage and expose V12 individual rank"
          git push origin HEAD:master
