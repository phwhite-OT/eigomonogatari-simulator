name: Metagame environment evaluation

on:
  # V6 is superseded by V8.2. Keep it available for an intentional manual
  # audit only, so its scheduled runs cannot delay Pages deployments.
  workflow_dispatch:
    inputs:
      max_tasks:
        description: Number of position tasks to complete before saving progress
        required: false
        default: "1"
        type: string
      workers:
        description: Workers per task (1 avoids rebuilding the full feasibility solver)
        required: false
        default: "1"
        type: string
      fallback_workers:
        description: Retry a failed task with this many workers to reduce memory pressure
        required: false
        default: "1"
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: metagame-v6
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      METAGAME_MAX_TASKS: ${{ inputs.max_tasks || '1' }}
      METAGAME_WORKERS: ${{ inputs.workers || '1' }}
      METAGAME_FALLBACK_WORKERS: ${{ inputs.fallback_workers || '1' }}
      METAGAME_CHECKPOINT_INTERVAL: "2"
      METAGAME_TIME_BUDGET_SECONDS: "9000"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore saved metagame results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin metagame-results || true
          if git show-ref --verify --quiet refs/remotes/origin/metagame-results; then
            git switch --create metagame-results --track origin/metagame-results
          else
            git switch --create metagame-results
          fi
          git rebase ${{ github.sha }}

      - id: evaluate
        name: Evaluate the next metagame task
        shell: bash
        run: |
          if [ -f reports/metagame-v6-batch-status.json ] && grep -q '"status": "completed"' reports/metagame-v6-batch-status.json && grep -q '"modelVersion": "iterative-metagame-v6-continuation-decks"' reports/metagame-v6-batch-status.json; then
            echo "completed_before=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/rate-metagame-batch.mjs \
            --status=reports/metagame-v6-batch-status.json \
            --output-root=reports/metagame-ratings-v6 \

            --max-tasks="$METAGAME_MAX_TASKS" \
            --fallback-workers="$METAGAME_FALLBACK_WORKERS" \
            --first-scenarios=12 \
            --final-scenarios=72 \
            --finalists=96 \
            --turns=12 \
            --checkpoint-interval="$METAGAME_CHECKPOINT_INTERVAL" \
            --time-budget-seconds="$METAGAME_TIME_BUDGET_SECONDS" \
            --workers="$METAGAME_WORKERS"
          if grep -q '"status": "completed"' reports/metagame-v6-batch-status.json; then
            echo "completed_now=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build simulator data after the final task
        if: steps.evaluate.outputs.completed_now == 'true'
        run: npm run build:metagame-data

      - name: Save completed task progress to the result branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/metagame-v6-batch-status.json
          if [ -f reports/metagame-v6-supervisor-status.json ]; then git add -f reports/metagame-v6-supervisor-status.json; fi
          if [ -f reports/metagame-v6-active.json ]; then git add -f reports/metagame-v6-active.json; fi
          if [ -d reports/metagame-ratings-v6 ]; then git add -f reports/metagame-ratings-v6; fi
          if [ -f src/data/metagame-simulator-data.js ]; then git add src/data/metagame-simulator-data.js; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: save metagame evaluation progress"
          git push --force-with-lease=refs/heads/metagame-results origin HEAD:metagame-results
      - name: Start the next metagame task
        if: success() && steps.evaluate.outputs.completed_now != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/metagame-cloud.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"ref\":\"master\",\"inputs\":{\"max_tasks\":\"$METAGAME_MAX_TASKS\",\"workers\":\"$METAGAME_WORKERS\",\"fallback_workers\":\"$METAGAME_FALLBACK_WORKERS\"}}"
