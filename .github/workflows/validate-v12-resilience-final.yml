name: Validate V12 resilience final

on:
  push:
    branches:
      - fix/v12-resumable-self-healing
    paths:
      - ".github/workflows/validate-v12-resilience-final.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate resilience implementation
        run: |
          node --check scripts/rate-metagame-v12.mjs
          node --check src/core/metagame-v12.js
          node --test test/metagame-v12-counterfactual-contribution.test.js test/metagame-v12-deck-first-ranking.test.js test/metagame-v12-recompute-resilience.test.js test/metagame-v12-dynamic-cost.test.js
          npm run build
