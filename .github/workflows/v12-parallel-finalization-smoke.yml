name: V12 parallel finalization smoke

on:
  push:
    branches:
      - fix/v12-parallel-finalization
    paths:
      - scripts/rate-metagame-v12.mjs
      - scripts/metagame-v12-evaluation-pool.mjs
      - .github/workflows/v12-parallel-finalization-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check scripts/rate-metagame-v12.mjs
          node --check scripts/metagame-v12-evaluation-pool.mjs
      - name: Compare serial and worker-pool battle results
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { CHARACTER_CATALOG } from "./src/data/character-catalog.js";
          import { METAGAME_V8_INPUTS } from "./src/data/metagame-v8-inputs.js";
          import { evaluateMetagameV7Deck, resolveMetagameV7Input } from "./src/core/metagame-v7.js";
          import { createMetagameV12EnvironmentDecks, createMetagameV12TeamScenarios } from "./src/core/metagame-v12.js";
          import { MetagameV12EvaluationPool } from "./scripts/metagame-v12-evaluation-pool.mjs";

          const input = METAGAME_V8_INPUTS.find((entry) => entry.id === "fire:100");
          const resolved = resolveMetagameV7Input(input, CHARACTER_CATALOG);
          const environmentDecks = createMetagameV12EnvironmentDecks(resolved, { count: 9, environmentVariants: 1 });
          const scenarios = createMetagameV12TeamScenarios(resolved, { environmentDecks, count: 9 });
          const decks = environmentDecks.slice(0, 4);
          assert.equal(decks.length, 4);
          const serial = decks.map((deck) => evaluateMetagameV7Deck(deck, scenarios, { turns: 12 }));
          const pool = new MetagameV12EvaluationPool({ teamScenarios: scenarios, turns: 12, workerCount: 4 });
          try {
            const parallel = await pool.evaluateMany(decks);
            assert.deepEqual(parallel, serial);
            console.log(`parallel evaluator matches serial evaluator with ${pool.workerCount} worker(s)`);
          } finally {
            await pool.close();
          }
          NODE
