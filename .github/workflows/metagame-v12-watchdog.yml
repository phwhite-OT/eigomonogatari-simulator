name: Metagame V12 recompute watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: metagame-v12-recompute-watchdog
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect stalled V12 work and self-heal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recompute_workflow="metagame-v12-shared-pool-recompute.yml"
          finalization_workflow="metagame-v12-finalization-fanout.yml"
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          ranking_policy="full-budget-opportunity-v9-adaptive-metagame"

          dispatch_workflow() {
            local workflow="$1"
            local output=""
            local delay=5
            for attempt in 1 2 3 4 5; do
              if output="$(gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref master 2>&1)"; then
                echo "V12 dispatch accepted on attempt $attempt: $workflow"
                return 0
              fi
              echo "V12 dispatch attempt $attempt failed for $workflow: $output" >&2
              if [ "$attempt" -lt 5 ]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            # Never strand a durable checkpoint because a dispatch failed. This
            # watchdog is scheduled regularly and will keep retrying.
            echo "::warning::Unable to dispatch $workflow after 5 attempts. Durable progress is safe; the next watchdog run will retry."
            return 0
          }

          if [ -z "$(git ls-remote --heads origin "$results_branch")" ]; then
            echo "Results branch does not exist; starting normal recompute."
            dispatch_workflow "$recompute_workflow"
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"

          attribute_groups=(
            "fire" "water" "wind"
            "fire-water" "fire-wind" "water-wind" "fire-water-wind"
          )
          representative_costs=(100 200 300 500)
          incomplete=0
          first_incomplete=""
          first_progress=""
          for cost in "${representative_costs[@]}"; do
            for attribute_group in "${attribute_groups[@]}"; do
              output_directory="${attribute_group}-${cost}"
              progress_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}/progress.json"
              marker_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}/ranking-policy.txt"
              progress="$(git show "$results_ref:$progress_path" 2>/dev/null || true)"
              marker="$(git show "$results_ref:$marker_path" 2>/dev/null || true)"
              if ! jq -e '.status == "complete" and .context.version == "team-battle-v12.5-effective-damage-individual-rank" and .context.battleSemantics == "opportunity-baseline-v6-target-priority" and .finalizationState.version == 2' <<< "$progress" >/dev/null 2>&1 || [ "$marker" != "$ranking_policy" ]; then
                incomplete=$((incomplete + 1))
                if [ -z "$first_incomplete" ]; then
                  first_incomplete="${attribute_group}:${cost}"
                  first_progress="$progress"
                fi
              fi
            done
          done

          if [ "$incomplete" -eq 0 ]; then
            echo "All 28 V12 conditions are complete under $ranking_policy."
            exit 0
          fi

          desired_workflow="$recompute_workflow"
          if [ -n "$first_progress" ] &&              jq -e '.status == "finalizing"
               and .context.version == "team-battle-v12.5-effective-damage-individual-rank"
               and .context.battleSemantics == "opportunity-baseline-v6-target-priority"
               and .finalizationState.phase == "counterfactual"
               and (.finalizationState.plan | type == "array")
               and (.finalizationState.cursor.planIndex < (.finalizationState.plan | length))' <<< "$first_progress" >/dev/null 2>&1; then
            desired_workflow="$finalization_workflow"
            cursor="$(jq -r '.finalizationState.cursor.planIndex' <<< "$first_progress")"
            plan_length="$(jq -r '.finalizationState.plan | length' <<< "$first_progress")"
            echo "$incomplete/28 conditions incomplete; first=$first_incomplete is finalizing at $cursor/$plan_length."
          else
            echo "$incomplete/28 conditions incomplete; first=$first_incomplete needs normal recompute."
          fi
          echo "Desired continuation workflow: $desired_workflow"

          # Keep GitHub's large workflow-run payloads out of shell argv.
          # Passing them through jq --argjson previously exceeded ARG_MAX and
          # made the watchdog fail before it could heal anything.
          recompute_runs_file="$RUNNER_TEMP/v12-recompute-runs.json"
          finalization_runs_file="$RUNNER_TEMP/v12-finalization-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${recompute_workflow}/runs?per_page=30" > "$recompute_runs_file"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${finalization_workflow}/runs?per_page=30" > "$finalization_runs_file"

          active_json="$(
            jq -c -s \
              --arg rw "$recompute_workflow" \
              --arg fw "$finalization_workflow" \
              '.[0] as $rr
               | .[1] as $fr
               | [
                   ($rr.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | {workflow:$rw,id,created_at,updated_at,status}),
                   ($fr.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | {workflow:$fw,id,created_at,updated_at,status})
                 ]' \
              "$recompute_runs_file" "$finalization_runs_file"
          )"

          # A workflow-level concurrency wait legitimately appears as "pending"
          # with zero jobs while another heavy V12 run owns the shared mutex.
          # Never kill a healthy running owner merely because a newer pending
          # continuation exists behind it.
          running="$(jq -c '[.[] | select(.status == "in_progress")] | sort_by(.updated_at) | reverse | .[0] // empty' <<< "$active_json")"
          desired_pending="$(jq -c --arg w "$desired_workflow" '
            [.[] | select(.workflow == $w and (.status == "queued" or .status == "pending"))]
            | sort_by(.created_at)
            | reverse
            | .[0] // empty
          ' <<< "$active_json")"

          if [ -n "$running" ]; then
            running_id="$(jq -r '.id' <<< "$running")"
            running_workflow="$(jq -r '.workflow' <<< "$running")"
            running_updated_at="$(jq -r '.updated_at // .created_at' <<< "$running")"
            now_epoch="$(date -u +%s)"
            updated_epoch="$(date -u -d "$running_updated_at" +%s)"
            inactive_minutes=$(( (now_epoch - updated_epoch) / 60 ))
            echo "Heavy V12 owner=$running_id workflow=$running_workflow inactive=${inactive_minutes}m."

            # Use recent activity rather than total run age. Long candidate waves
            # may legitimately exceed three hours end-to-end while still making
            # progress. Only recycle a run that has shown no GitHub activity for
            # three hours.
            if [ "$inactive_minutes" -le 180 ]; then
              if [ -n "$desired_pending" ]; then
                pending_id="$(jq -r '.id' <<< "$desired_pending")"
                echo "Desired continuation $pending_id is waiting behind healthy owner $running_id; leaving both intact."
              else
                echo "Healthy heavy V12 work is active; no recovery action needed."
              fi
              exit 0
            fi

            echo "Heavy V12 owner $running_id has had no activity for more than 180m; cancelling it."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${running_id}/cancel" >/dev/null 2>&1 || true
            sleep 5

            # If the correct continuation is already pending, releasing the
            # concurrency owner is enough. Do not create a replacement that
            # would evict the existing pending run.
            if [ -n "$desired_pending" ]; then
              pending_id="$(jq -r '.id' <<< "$desired_pending")"
              echo "Pending continuation $pending_id can take over after the stale owner releases the mutex."
              exit 0
            fi
          fi

          if [ -n "$desired_pending" ]; then
            pending_id="$(jq -r '.id' <<< "$desired_pending")"
            pending_created_at="$(jq -r '.created_at' <<< "$desired_pending")"
            now_epoch="$(date -u +%s)"
            pending_epoch="$(date -u -d "$pending_created_at" +%s)"
            pending_age_minutes=$(( (now_epoch - pending_epoch) / 60 ))

            # With no heavy owner, a pending run should leave the concurrency
            # queue quickly. If it does not, recycle only that orphaned pending
            # run instead of cancelling valid computation.
            if [ "$pending_age_minutes" -le 15 ]; then
              echo "Desired continuation $pending_id is pending with no heavy owner, age=${pending_age_minutes}m; allowing GitHub time to schedule it."
              exit 0
            fi

            echo "Desired continuation $pending_id has been orphan-pending for ${pending_age_minutes}m; recycling it."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${pending_id}/cancel" >/dev/null 2>&1 || true
            sleep 5
          fi

          # No healthy owner and no usable desired pending continuation remain.
          # Remove obsolete queued/pending work from the shared mutex, then
          # dispatch exactly the workflow implied by the durable checkpoint.
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Cancelling obsolete queued V12 run $run_id before starting $desired_workflow."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
          done < <(jq -r --arg w "$desired_workflow" '
            .[]
            | select((.status == "queued" or .status == "pending") and .workflow != $w)
            | .id
          ' <<< "$active_json")

          echo "Dispatching self-healing V12 continuation: $desired_workflow"
          dispatch_workflow "$desired_workflow"
