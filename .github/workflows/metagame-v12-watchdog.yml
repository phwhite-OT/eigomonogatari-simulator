name: Metagame V12 recompute watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: metagame-v12-recompute-watchdog
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect stalled V12 work and self-heal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recompute_workflow="metagame-v12-shared-pool-recompute.yml"
          finalization_workflow="metagame-v12-finalization-fanout.yml"
          results_branch="metagame-v12-shared-pool-results"
          results_ref="refs/remotes/origin/$results_branch"
          ranking_policy="full-budget-opportunity-v8-mean-primary-slot"

          dispatch_workflow() {
            local workflow="$1"
            local output=""
            local delay=5
            for attempt in 1 2 3 4 5; do
              if output="$(gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref master 2>&1)"; then
                echo "V12 dispatch accepted on attempt $attempt: $workflow"
                return 0
              fi
              echo "V12 dispatch attempt $attempt failed for $workflow: $output" >&2
              if [ "$attempt" -lt 5 ]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            # Never strand a durable checkpoint because a dispatch failed. This
            # watchdog runs again every 30 minutes and will keep retrying.
            echo "::warning::Unable to dispatch $workflow after 5 attempts. Durable progress is safe; the next watchdog run will retry."
            return 0
          }

          if [ -z "$(git ls-remote --heads origin "$results_branch")" ]; then
            echo "Results branch does not exist; starting normal recompute."
            dispatch_workflow "$recompute_workflow"
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/$results_branch:$results_ref"

          attribute_groups=(
            "fire" "water" "wind"
            "fire-water" "fire-wind" "water-wind" "fire-water-wind"
          )
          representative_costs=(100 200 300 500)
          incomplete=0
          first_incomplete=""
          first_progress=""
          for cost in "${representative_costs[@]}"; do
            for attribute_group in "${attribute_groups[@]}"; do
              output_directory="${attribute_group}-${cost}"
              progress_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}/progress.json"
              marker_path="reports/metagame-ratings-v12-team-opportunity/${output_directory}/ranking-policy.txt"
              progress="$(git show "$results_ref:$progress_path" 2>/dev/null || true)"
              marker="$(git show "$results_ref:$marker_path" 2>/dev/null || true)"
              if ! jq -e '.status == "complete" and .context.version == "team-battle-v12.5-effective-damage-individual-rank" and .context.battleSemantics == "opportunity-baseline-v6-target-priority" and .finalizationState.version == 3 and .finalizationState.equilibriumVersion == 1' <<< "$progress" >/dev/null 2>&1 || [ "$marker" != "$ranking_policy" ]; then
                incomplete=$((incomplete + 1))
                if [ -z "$first_incomplete" ]; then
                  first_incomplete="${attribute_group}:${cost}"
                  first_progress="$progress"
                fi
              fi
            done
          done

          if [ "$incomplete" -eq 0 ]; then
            echo "All 28 V12 conditions are complete under $ranking_policy."
            exit 0
          fi

          desired_workflow="$recompute_workflow"
          if [ -n "$first_progress" ] &&              jq -e '.status == "finalizing"
               and .context.version == "team-battle-v12.5-effective-damage-individual-rank"
               and .context.battleSemantics == "opportunity-baseline-v6-target-priority"
               and .finalizationState.version == 3
               and .finalizationState.phase == "counterfactual"
               and (.finalizationState.plan | type == "array")
               and (.finalizationState.cursor.planIndex < (.finalizationState.plan | length))' <<< "$first_progress" >/dev/null 2>&1; then
            desired_workflow="$finalization_workflow"
            cursor="$(jq -r '.finalizationState.cursor.planIndex' <<< "$first_progress")"
            plan_length="$(jq -r '.finalizationState.plan | length' <<< "$first_progress")"
            echo "$incomplete/28 conditions incomplete; first=$first_incomplete is finalizing at $cursor/$plan_length."
          else
            echo "$incomplete/28 conditions incomplete; first=$first_incomplete needs normal recompute."
          fi
          echo "Desired continuation workflow: $desired_workflow"

          recompute_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${recompute_workflow}/runs?per_page=30")"
          finalization_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${finalization_workflow}/runs?per_page=30")"

          active_json="$(
            jq -n               --arg rw "$recompute_workflow"               --arg fw "$finalization_workflow"               --argjson rr "$recompute_runs"               --argjson fr "$finalization_runs"               '[
                ($rr.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | {workflow:$rw,id,created_at,status}),
                ($fr.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | {workflow:$fw,id,created_at,status})
              ] | sort_by(.created_at) | reverse'
          )"

          desired_active="$(jq -c --arg w "$desired_workflow" '[.[] | select(.workflow == $w)][0] // empty' <<< "$active_json")"
          if [ -n "$desired_active" ]; then
            keep_id="$(jq -r '.id' <<< "$desired_active")"
            keep_status="$(jq -r '.status' <<< "$desired_active")"
            created_at="$(jq -r '.created_at' <<< "$desired_active")"

            # Cancel queued/running duplicates, including the wrong workflow,
            # so the shared concurrency group cannot be clogged indefinitely.
            while IFS= read -r run_id; do
              [ "$run_id" = "$keep_id" ] && continue
              echo "Cancelling duplicate/obsolete V12 run $run_id; keeping $keep_id."
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            done < <(jq -r '.[].id' <<< "$active_json")

            if [ "$keep_status" = "queued" ] || [ "$keep_status" = "pending" ]; then
              echo "Desired continuation $keep_id is already $keep_status."
              exit 0
            fi

            now_epoch="$(date -u +%s)"
            created_epoch="$(date -u -d "$created_at" +%s)"
            age_minutes=$(( (now_epoch - created_epoch) / 60 ))
            echo "Desired V12 run=$keep_id age=${age_minutes}m."

            # Fanout can spend up to ~135m in parallel prefill plus merge time;
            # normal candidate segments are also long. Anything beyond 180m is
            # treated as wedged and safely restarted from durable progress.
            if [ "$age_minutes" -le 180 ]; then
              echo "Desired continuation is active and within the healthy window."
              exit 0
            fi

            echo "Desired run exceeded 180m; cancelling and restarting from durable checkpoint."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${keep_id}/cancel" >/dev/null 2>&1 || true
            sleep 5
          else
            # No correct continuation is active. Cancel anything obsolete before
            # dispatching the workflow implied by the durable checkpoint itself.
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "Cancelling obsolete V12 run $run_id before starting $desired_workflow."
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            done < <(jq -r '.[].id' <<< "$active_json")
          fi

          echo "Dispatching self-healing V12 continuation: $desired_workflow"
          dispatch_workflow "$desired_workflow"
