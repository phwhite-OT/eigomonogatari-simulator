name: Deploy public site

on:
  push:
    branches:
      - master
      - metagame-v12-shared-pool-results
      - metagame-v12-browser-knowledge-results
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          report_root="reports/metagame-ratings-v12-team-opportunity"
          shared_branch="metagame-v12-shared-pool-results"
          fallback_branch="metagame-v12-team-opportunity-results"
          ranking_policy="full-budget-opportunity-v8-mean-primary-slot"
          model_version="team-battle-v12.5-effective-damage-individual-rank"
          battle_semantics="opportunity-baseline-v5-effective-damage"

          # Start from the last broadly complete public snapshot so unfinished
          # conditions remain usable. Each newly completed shared-pool condition
          # is then overlaid independently instead of waiting for all 28.
          if git fetch --depth=1 origin "+refs/heads/$fallback_branch:refs/remotes/origin/$fallback_branch"; then
            fallback_ref="refs/remotes/origin/$fallback_branch"
            if git cat-file -e "$fallback_ref:$report_root" 2>/dev/null; then
              git checkout "$fallback_ref" -- "$report_root"
              echo "Loaded fallback V12 report snapshot."
            fi
          fi

          published_current=()
          if git fetch --depth=1 origin "+refs/heads/$shared_branch:refs/remotes/origin/$shared_branch"; then
            shared_ref="refs/remotes/origin/$shared_branch"
            attribute_groups=(fire water wind fire-water fire-wind water-wind fire-water-wind)
            representative_costs=(100 200 300 500)

            for cost in "${representative_costs[@]}"; do
              for attribute_group in "${attribute_groups[@]}"; do
                output_directory="${attribute_group}-${cost}"
                output_path="$report_root/$output_directory"
                marker="$(git show "$shared_ref:$output_path/ranking-policy.txt" 2>/dev/null || true)"

                if git show "$shared_ref:$output_path/progress.json" 2>/dev/null | jq -e \
                  --arg version "$model_version" \
                  --arg semantics "$battle_semantics" \
                  '.status == "complete"
                    and .context.version == $version
                    and .context.battleSemantics == $semantics
                    and .finalizationState.version == 2' \
                  >/dev/null 2>&1 && \
                   [ "$marker" = "$ranking_policy" ] && \
                   git cat-file -e "$shared_ref:$output_path/report.json" 2>/dev/null; then
                  git checkout "$shared_ref" -- "$output_path"
                  published_current+=("$output_directory")
                  echo "Publishing current shared-pool result: $output_directory"
                fi
              done
            done
          fi

          echo "Current shared-pool conditions published: ${#published_current[@]}"
          if [ "${#published_current[@]}" -gt 0 ]; then
            printf '  - %s\n' "${published_current[@]}"
          fi

          # Browser knowledge is an optional, lazily loaded acceleration layer.
          # A missing condition never blocks deployment; the browser falls back
          # to published V12 decks and the same incremental battle evaluator.
          knowledge_branch="metagame-v12-browser-knowledge-results"
          knowledge_root="reports/metagame-browser-knowledge"
          if git fetch --depth=1 origin "$knowledge_branch"; then
            knowledge_ref="FETCH_HEAD"
            if git cat-file -e "$knowledge_ref:$knowledge_root" 2>/dev/null; then
              git checkout "$knowledge_ref" -- "$knowledge_root"
            fi
          fi

          npm run build
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/metagame-knowledge
          if [ -d "$knowledge_root" ]; then
            while IFS= read -r knowledge_file; do
              directory="$(basename "$(dirname "$knowledge_file")")"
              jq '{
                schemaVersion,
                generatedAt,
                inputId,
                sourceGeneratedAt,
                modelVersion,
                context,
                representativeScenarios,
                characterIds,
                candidatePriors,
                deckLibrary,
                pairPriors
              }' "$knowledge_file" > "_site/metagame-knowledge/$directory.json"
            done < <(find "$knowledge_root" -mindepth 2 -maxdepth 2 -type f -name 'browser-knowledge.json' -print | sort)
          fi
          mkdir -p _site/character-images
          find character-images -maxdepth 1 -type f \
            \( -iname '*.avif' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) \
            -exec cp {} _site/character-images/ \;

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
