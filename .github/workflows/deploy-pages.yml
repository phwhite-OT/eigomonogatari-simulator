name: Deploy public site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          report_root="reports/metagame-ratings-v12-team-opportunity"
          shared_branch="metagame-v12-shared-pool-results"
          fallback_branch="metagame-v12-team-opportunity-results"
          shared_ready=true

          if git fetch --depth=1 origin "$shared_branch"; then
            shared_ref="FETCH_HEAD"
            for output_directory in fire-100 water-100 wind-100 fire-water-100 fire-wind-100 water-wind-100; do
              progress="$(git show "$shared_ref:$report_root/$output_directory/progress.json" 2>/dev/null || true)"
              if ! jq -e '.status == "complete" and .context.battleSemantics == "skill-target-revive-v2"' <<< "$progress" >/dev/null 2>&1; then
                shared_ready=false
                break
              fi
            done
          else
            shared_ready=false
          fi

          if [ "$shared_ready" = true ]; then
            echo "Deploying corrected V12 shared-pool results."
            git checkout "$shared_ref" -- "$report_root"
          else
            echo "Corrected shared-pool results are not complete yet; deploying the last complete V12 results."
            git fetch --depth=1 origin "$fallback_branch"
            git checkout FETCH_HEAD -- "$report_root"
          fi

          npm run build
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/character-images
          find character-images -maxdepth 1 -type f \
            \( -iname '*.avif' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) \
            -exec cp {} _site/character-images/ \;

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
