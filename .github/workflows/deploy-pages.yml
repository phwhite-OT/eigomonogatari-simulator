name: Deploy public site

on:
  push:
    branches:
      - master
      - metagame-v12-shared-pool-results
      - metagame-v12-browser-knowledge-results
  workflow_run:
    workflows:
      - "Metagame V12 distributed finalization accelerator"
      - "Metagame V12 shared-pool full recompute"
      - "V12 cost100 lightweight rerank"
      - "Metagame V12 browser knowledge precompute"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run browser deck-generation regression tests
        run: node --test test/metagame-deck.test.js test/metagame-v12-dynamic-cost.test.js test/metagame-v12-browser-cache.test.js test/metagame-ui-model-compat.test.js test/metagame-worker.test.js test/simulate.test.js test/team-battle-ai-regression.test.js test/v12-battle-corrections.test.js test/skills.test.js test/battle-state.test.js

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          report_root="reports/metagame-ratings-v12-team-opportunity"
          shared_branch="metagame-v12-shared-pool-results"
          fallback_branch="metagame-v12-team-opportunity-results"
          ranking_policy="full-budget-opportunity-v9-adaptive-metagame"
          model_version="team-battle-v12.7-character-catalog-20261004-individual-rank"
          battle_semantics="opportunity-baseline-v6-target-priority"

          # Start from the last broadly complete public snapshot so unfinished
          # conditions remain usable. Only conditions backed by exact supplied
          # environments are eligible for a current shared-pool overlay.
          if git fetch --depth=1 origin "+refs/heads/$fallback_branch:refs/remotes/origin/$fallback_branch"; then
            fallback_ref="refs/remotes/origin/$fallback_branch"
            if git cat-file -e "$fallback_ref:$report_root" 2>/dev/null; then
              git checkout "$fallback_ref" -- "$report_root"
              echo "Loaded fallback V12 report snapshot."
            fi
          fi

          # Remove planned representative directories that are not currently
          # backed by exact supplied environments, including any stale fallback
          # snapshot from the old nearest-anchor behaviour.
          mapfile -t ready_inputs < <(node scripts/list-metagame-v12-precompute-inputs.mjs)
          declare -A ready_report_dirs=()
          for input_id in "${ready_inputs[@]}"; do
            ready_report_dirs["${input_id//:/-}"]=1
          done
          if [ -d "$report_root" ]; then
            while IFS= read -r directory; do
              name="$(basename "$directory")"
              cost="${name##*-}"
              case "$cost" in
                100|200|300|500)
                  if [ -z "${ready_report_dirs[$name]+x}" ]; then
                    rm -rf "$directory"
                    echo "Removing published representative result without exact environment: $name"
                  fi
                  ;;
              esac
            done < <(find "$report_root" -mindepth 1 -maxdepth 1 -type d -print)
          fi

          published_current=()
          if git fetch --depth=1 origin "+refs/heads/$shared_branch:refs/remotes/origin/$shared_branch"; then
            shared_ref="refs/remotes/origin/$shared_branch"
            mapfile -t ready_inputs < <(node scripts/list-metagame-v12-precompute-inputs.mjs)

            for input_id in "${ready_inputs[@]}"; do
                output_directory="${input_id//:/-}"
                output_path="$report_root/$output_directory"
                marker="$(git show "$shared_ref:$output_path/ranking-policy.txt" 2>/dev/null || true)"

                # ranking-policy.txt is tiny, so reject stale/incomplete
                # conditions before parsing their potentially large progress
                # checkpoint.
                if [ "$marker" = "$ranking_policy" ] && \
                   git show "$shared_ref:$output_path/report.json" 2>/dev/null | jq -e \
                     --arg policy "$ranking_policy" \
                     '.rankingPolicy == $policy and .adaptiveMetagame.version == 2' \
                     >/dev/null 2>&1 && \
                   git show "$shared_ref:$output_path/progress.json" 2>/dev/null | jq -e \
                     --arg version "$model_version" \
                     --arg semantics "$battle_semantics" \
                     '.status == "complete"
                       and .context.version == $version
                       and .context.battleSemantics == $semantics
                       and .finalizationState.version == 2
                       and .adaptiveMetagame.version == 2' \
                     >/dev/null 2>&1; then
                  git checkout "$shared_ref" -- "$output_path"
                  published_current+=("$output_directory")
                  echo "Publishing current shared-pool result: $output_directory"
                fi
            done
          fi

          echo "Current shared-pool conditions published: ${#published_current[@]}"
          if [ "${#published_current[@]}" -gt 0 ]; then
            printf '  - %s\n' "${published_current[@]}"
          fi

          # Browser knowledge is an optional, lazily loaded acceleration layer.
          # A missing condition never blocks deployment; the browser falls back
          # to published V12 decks and the same incremental battle evaluator.
          knowledge_branch="metagame-v12-browser-knowledge-results"
          knowledge_root="reports/metagame-browser-knowledge"
          if git fetch --depth=1 origin "$knowledge_branch"; then
            knowledge_ref="FETCH_HEAD"
            if git cat-file -e "$knowledge_ref:$knowledge_root" 2>/dev/null; then
              git checkout "$knowledge_ref" -- "$knowledge_root"
            fi
          fi

          # Do not ship stale browser-knowledge packages for planned costs that
          # still lack their own environment data.
          if [ -d "$knowledge_root" ]; then
            mapfile -t ready_inputs < <(node scripts/list-metagame-v12-precompute-inputs.mjs)
            declare -A ready_knowledge_dirs=()
            for input_id in "${ready_inputs[@]}"; do
              ready_knowledge_dirs["${input_id//:/-}"]=1
            done
            while IFS= read -r directory; do
              name="$(basename "$directory")"
              if [ -z "${ready_knowledge_dirs[$name]+x}" ]; then
                rm -rf "$directory"
                echo "Skipping browser knowledge without exact supplied environment: $name"
              fi
            done < <(find "$knowledge_root" -mindepth 1 -maxdepth 1 -type d -print)
          fi

          npm run build
          mkdir -p _site
          cp index.html _site/index.html

          # The expensive V12 search runs in a same-origin module Worker so
          # the UI thread stays responsive. Ship exactly the core modules used
          # by that worker; the calculation code is the same source exercised
          # by Node regression tests above.
          mkdir -p _site/src/core _site/src/data
          cp \
            src/core/metagame-worker.js \
            src/core/metagame-deck.js \
            src/core/battleState.js \
            src/core/simulate.js \
            src/core/environment-rating.js \
            src/core/filter.js \
            src/core/skills.js \
            src/core/damage.js \
            _site/src/core/
          cp src/data/rules.js _site/src/data/rules.js

          mkdir -p _site/metagame-knowledge
          if [ -d "$knowledge_root" ]; then
            while IFS= read -r knowledge_file; do
              directory="$(basename "$(dirname "$knowledge_file")")"
              jq '{
                schemaVersion,
                policyVersion,
                generatedAt,
                inputId,
                sourceGeneratedAt,
                modelVersion,
                context,
                representativeScenarios,
                characterIds,
                candidatePriors,
                deckLibrary,
                neighborhoods,
                pairPriors,
                boostModel
              }' "$knowledge_file" > "_site/metagame-knowledge/$directory.json"
            done < <(find "$knowledge_root" -mindepth 2 -maxdepth 2 -type f -name 'browser-knowledge.json' -print | sort)
          fi
          mkdir -p _site/character-images
          find character-images -maxdepth 1 -type f \
            \( -iname '*.avif' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) \
            -exec cp {} _site/character-images/ \;

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
