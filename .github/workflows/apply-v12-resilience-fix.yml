name: Apply V12 resilience fix

on:
  push:
    branches:
      - fix/v12-resumable-self-healing
    paths:
      - "scripts/apply-v12-resilience-fix.mjs"
      - ".github/workflows/apply-v12-resilience-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v12-resumable-self-healing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact patch
        run: node scripts/apply-v12-resilience-fix.mjs
      - name: Validate changed source
        run: |
          git diff --check
          node --check scripts/rate-metagame-v12.mjs
          node --check src/core/metagame-v12.js
          node --test test/metagame-v12-counterfactual-contribution.test.js test/metagame-v12-deck-first-ranking.test.js test/metagame-v12-recompute-resilience.test.js
          npm run build
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/rate-metagame-v12.mjs src/core/metagame-v12.js .github/workflows/metagame-v12-shared-pool-recompute.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "fix: make V12 recompute resumable and self-healing"
          git push origin HEAD:fix/v12-resumable-self-healing
