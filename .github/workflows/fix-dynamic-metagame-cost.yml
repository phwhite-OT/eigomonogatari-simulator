name: Apply dynamic metagame cost fix

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-dynamic-metagame-cost.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch dynamic cost scoring and add regression test
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("src/core/metagame-deck.js")
          source = source_path.read_text(encoding="utf-8")
          old = '''function metagameCandidateScore(rating, totalCost) {
            const publishedCostAwareScore = Number(rating.costAwareScore);
            if (Number.isFinite(publishedCostAwareScore)) return metagameDeckClampUnit(publishedCostAwareScore);
            const marginalLowerBound = Number(rating.marginalWinGainLowerBound);
            const marginalWinGain = Number(rating.marginalWinGain);
            if (Number.isFinite(marginalLowerBound) || Number.isFinite(marginalWinGain)) {
              const lower = Math.max(0, Number.isFinite(marginalLowerBound) ? marginalLowerBound : marginalWinGain);
              const mean = Math.max(0, Number.isFinite(marginalWinGain) ? marginalWinGain : lower);
              const contributionReference = 0.2;
              const reliableContribution = metagameDeckClampUnit(lower / contributionReference);
              const measuredContribution = metagameDeckClampUnit(mean / contributionReference);
              const budget = Math.max(1, Number(totalCost ?? rating.evaluationCostCap) || 1);
              const price = Math.max(1, Number(rating.cost) || 1);
              const costEfficiency = metagameDeckClampUnit(1 - Math.exp(-1.1 * lower * budget / price));
              // Controlled marginal evidence remains primary, while 35% of the browser
              // candidate order is explicitly the contribution bought per cost.
              return reliableContribution * 0.46 + measuredContribution * 0.19 + costEfficiency * 0.35;
            }
          '''
          new = '''function metagameCandidateScore(rating, totalCost) {
            const budget = Math.max(1, Number(totalCost ?? rating.evaluationCostCap) || 1);
            const price = Math.max(1, Number(rating.cost) || 1);
            const budgetShare = metagameDeckClampUnit(price / budget);
            const publishedCostAwareScore = Number(rating.costAwareScore);
            const budgetAdjustedPublishedScore = Number.isFinite(publishedCostAwareScore)
              ? metagameDeckClampUnit(publishedCostAwareScore) * (1 - budgetShare * 0.65)
              : null;
            const marginalLowerBound = Number(rating.marginalWinGainLowerBound);
            const marginalWinGain = Number(rating.marginalWinGain);
            if (Number.isFinite(marginalLowerBound) || Number.isFinite(marginalWinGain)) {
              const lower = Math.max(0, Number.isFinite(marginalLowerBound) ? marginalLowerBound : marginalWinGain);
              const mean = Math.max(0, Number.isFinite(marginalWinGain) ? marginalWinGain : lower);
              const contributionReference = 0.2;
              const reliableContribution = metagameDeckClampUnit(lower / contributionReference);
              const measuredContribution = metagameDeckClampUnit(mean / contributionReference);
              const costEfficiency = metagameDeckClampUnit(1 - Math.exp(-1.1 * lower * budget / price));
              const marginalScore = reliableContribution * 0.46 + measuredContribution * 0.19 + costEfficiency * 0.35;
              // V12 publishes a condition-level score, but arbitrary user caps such as
              // 146 must be repriced against the current budget. Treat the published
              // score as a quality prior instead of bypassing current-cost opportunity cost.
              return budgetAdjustedPublishedScore === null
                ? marginalScore
                : marginalScore * 0.55 + budgetAdjustedPublishedScore * 0.45;
            }
            if (budgetAdjustedPublishedScore !== null) return budgetAdjustedPublishedScore;
          '''
          if old not in source:
            raise SystemExit("Target metagameCandidateScore block not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("test/metagame-v12-dynamic-cost.test.js")
          test_path.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { buildMetagameDeckCandidates } from "../src/core/metagame-deck.js";

          function character(id, cost, position) {
            return {
              id,
              name: id,
              attributes: ["fire"],
              rarity: "R",
              cost,
              hp: 1000,
              pow: 1000,
              skillTurn: Math.max(0, position - 1),
              maxUses: 0,
              roleTags: [],
              skillName: "",
              skill: {
                type: "none",
                multiplier: 1,
                hits: 1,
                amount: 0,
                target: "self",
                targetCount: 1,
                duration: 1,
                conditions: [],
                effects: [],
              },
            };
          }

          function rating(entry, costAwareScore) {
            return {
              id: entry.id,
              name: entry.name,
              attributes: entry.attributes,
              rarity: entry.rarity,
              cost: entry.cost,
              skillTurn: entry.skillTurn,
              skillType: "none",
              role: "neutral",
              costAwareScore,
              practicalValue: 1,
              individualScore: 0.5,
              roleFit: 0.5,
              marginalWinGainLowerBound: 0.02,
              marginalWinGain: 0.03,
              expectedWinRate: 0.6,
              expectedWinLowerBound: 0.5,
              balancedContribution: 0.5,
              roleBreakdown: {},
            };
          }

          function makeFixture(totalCost) {
            const expensive = character("expensive", 75, 1);
            const efficient = character("efficient", 20, 1);
            const fillers = [2, 3, 4, 5].map((position) => character(`filler-${position}`, 5, position));
            const constraint = {
              id: `fire:${totalCost}`,
              allowedAttributes: ["fire"],
              totalCost,
              slots: [
                {
                  position: 1,
                  candidates: [
                    rating(expensive, 0.75),
                    rating(efficient, 0.50),
                  ],
                },
                ...fillers.map((entry, index) => ({
                  position: index + 2,
                  candidates: [rating(entry, 0.45)],
                })),
              ],
            };
            return { constraint, characters: [expensive, efficient, ...fillers] };
          }

          test("V12 published scores are repriced against the current deck budget", () => {
            const lowBudget = makeFixture(100);
            const lowDecks = buildMetagameDeckCandidates(lowBudget.constraint, lowBudget.characters, { beamWidth: 500 });
            assert.equal(lowDecks[0].deck[0].id, "efficient", "75-cost card must not dominate a 100-cost deck on stale published score alone");

            const highBudget = makeFixture(300);
            const highDecks = buildMetagameDeckCandidates(highBudget.constraint, highBudget.characters, { beamWidth: 500 });
            assert.equal(highDecks[0].deck[0].id, "expensive", "the same card may become worthwhile when the current budget can actually support it");
          });
          ''', encoding="utf-8")
      - name: Run tests
        run: npm test
      - name: Run build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-dynamic-metagame-cost.yml
          git add src/core/metagame-deck.js test/metagame-v12-dynamic-cost.test.js .github/workflows/fix-dynamic-metagame-cost.yml
          git commit -m "Fix metagame scoring for arbitrary cost caps"
          git push
