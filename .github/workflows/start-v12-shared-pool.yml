name: Start V12 shared-pool recompute

# Restart marker: 2026-08-30 attack-mode-target-fix
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/start-v12-shared-pool.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older shared-pool recompute runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run list --workflow metagame-v12-shared-pool-recompute.yml --repo "${{ github.repository }}" --limit 30 --json databaseId,status \
            --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            gh run cancel "$run_id" --repo "${{ github.repository }}" || true
          done
      - name: Drop stale pre-fix shared-pool results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The attack-mode recipient fix changes battle semantics. Reusing any
          # checkpoint/evaluation cache produced before it would mix old and new
          # battles, so the isolated recompute branch must start completely fresh.
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/git/refs/heads/metagame-v12-shared-pool-results" \
            || true
      - name: Start fresh six-environment recompute
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run metagame-v12-shared-pool-recompute.yml --repo "${{ github.repository }}" --ref master
