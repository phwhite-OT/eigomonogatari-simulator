name: Metagame v7 fixed-environment evaluation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/metagame-v7-cloud.yml
      - scripts/rate-metagame-v7.mjs
      - scripts/build-metagame-simulator-data.mjs
      - src/core/metagame-v7.js
      - src/core/metagame-deck.js
      - src/core/simulate.js
      - src/data/metagame-v7-inputs.js
      - src/data/workbook-characters.js
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: metagame-v7
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      METAGAME_TIME_BUDGET_SECONDS: "10000"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore v7 progress
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin metagame-v7-results || true
          if git show-ref --verify --quiet refs/remotes/origin/metagame-v7-results; then
            git switch --create metagame-v7-results --track origin/metagame-v7-results
          else
            git switch --create metagame-v7-results
          fi
          git rebase ${{ github.sha }}

      - id: next
        name: Select the next fixed environment
        shell: bash
        run: |
          input_ids=("fire:100" "water:100" "wind:100" "fire-water:100")
          for input_id in "${input_ids[@]}"; do
            output_directory="${input_id//:/-}"
            progress_path="reports/metagame-ratings-v7/$output_directory/progress.json"
            if [ -f "$progress_path" ] && grep -q '"status": "complete"' "$progress_path" && grep -q '"version": "fixed-environment-v7.2"' "$progress_path"; then
              continue
            fi
            echo "input=$input_id" >> "$GITHUB_OUTPUT"
            echo "output_directory=$output_directory" >> "$GITHUB_OUTPUT"
            echo "all_completed=false" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "input=" >> "$GITHUB_OUTPUT"
          echo "output_directory=" >> "$GITHUB_OUTPUT"
          echo "all_completed=true" >> "$GITHUB_OUTPUT"

      - id: evaluate
        name: Evaluate the next unfinished position
        if: steps.next.outputs.input != ''
        continue-on-error: true
        run: |
          node scripts/rate-metagame-v7.mjs \
            --input="${{ steps.next.outputs.input }}" \
            --position=next \
            --time-budget-seconds="$METAGAME_TIME_BUDGET_SECONDS"

      - id: status
        name: Check evaluation status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.next.outputs.all_completed }}" = "true" ]; then
            echo "input_completed=true" >> "$GITHUB_OUTPUT"
            echo "all_completed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          progress_path="reports/metagame-ratings-v7/${{ steps.next.outputs.output_directory }}/progress.json"
          input_completed=false
          if [ -f "$progress_path" ] && grep -q '"status": "complete"' "$progress_path" && grep -q '"version": "fixed-environment-v7.2"' "$progress_path"; then
            input_completed=true
          fi
          all_completed=true
          for output_directory in fire-100 water-100 wind-100 fire-water-100; do
            if ! [ -f "reports/metagame-ratings-v7/$output_directory/progress.json" ] || ! grep -q '"status": "complete"' "reports/metagame-ratings-v7/$output_directory/progress.json" || ! grep -q '"version": "fixed-environment-v7.2"' "reports/metagame-ratings-v7/$output_directory/progress.json"; then
              all_completed=false
              break
            fi
          done
          echo "all_completed=$all_completed" >> "$GITHUB_OUTPUT"
          if [ "$all_completed" = "true" ]; then
            input_completed=true
          fi
          echo "input_completed=$input_completed" >> "$GITHUB_OUTPUT"

      - id: recovery
        name: Record recoverable evaluation failures
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.next.outputs.all_completed }}" = "true" ]; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state_path="reports/metagame-ratings-v7/${{ steps.next.outputs.output_directory }}/recovery.json"
          mkdir -p "$(dirname "$state_path")"
          outcome="${{ steps.evaluate.outcome }}"
          previous=0
          if [ -f "$state_path" ]; then
            previous="$(jq -r '.consecutiveFailures // 0' "$state_path" 2>/dev/null || echo 0)"
          fi
          if [ "$outcome" = "failure" ]; then
            failures=$((previous + 1))
          else
            failures=0
          fi
          printf '{\n  "consecutiveFailures": %s,\n  "lastOutcome": "%s",\n  "updatedAt": "%s"\n}\n' \
            "$failures" "$outcome" "$(date --iso-8601=seconds)" > "$state_path"
          if [ "${{ steps.status.outputs.all_completed }}" = "true" ]; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=false" >> "$GITHUB_OUTPUT"
          elif [ "$outcome" = "failure" ] && [ "$failures" -ge 3 ]; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build browser data from the completed v7 report
        if: steps.status.outputs.input_completed == 'true' && steps.evaluate.outcome == 'success'
        run: npm run build

      - name: Save v7 progress to the result branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/metagame-ratings-v7
          if [ -f src/data/metagame-simulator-data.js ]; then git add src/data/metagame-simulator-data.js; fi
          if [ -f index.html ]; then git add index.html; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: save metagame v7 evaluation progress"
          git push --force-with-lease=refs/heads/metagame-v7-results origin HEAD:metagame-v7-results

      - name: Create an issue after automatic retries are exhausted
        if: always() && steps.recovery.outputs.retry_exhausted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The v7 metagame evaluator for ${{ steps.next.outputs.input }} failed three consecutive times. Progress and recovery state are saved on the metagame-v7-results branch. Review the latest Actions run for the error log."
          payload="$(jq -n --arg title "v7 evaluation stopped after automatic retries" --arg body "$body" '{title: $title, body: $body}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/issues" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload"

      - name: Start the next evaluation segment
        if: always() && steps.recovery.outputs.should_continue == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/metagame-v7-cloud.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"${{ github.ref_name }}"}'

      - name: Mark unrecoverable evaluation failure
        if: always() && steps.recovery.outputs.retry_exhausted == 'true'
        run: exit 1
