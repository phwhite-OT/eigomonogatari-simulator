name: Metagame v8 5v5 team-battle evaluation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/metagame-v7-cloud.yml
      - scripts/rate-metagame-v7.mjs
      - scripts/build-metagame-simulator-data.mjs
      - src/core/metagame-v7.js
      - src/core/battleState.js
      - src/core/metagame-deck.js
      - src/core/simulate.js
      - src/core/skills.js
      - src/data/metagame-v7-inputs.js
      - src/data/character-catalog.js
      - src/data/workbook-characters.js
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

# The matrix workers never write to this branch. Keep the single publish job
# serialized so independent runs cannot overwrite one another's checkpoints.
concurrency:
  group: metagame-v8
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      work_matrix: ${{ steps.next.outputs.work_matrix }}
      targets: ${{ steps.next.outputs.targets }}
      all_completed: ${{ steps.next.outputs.all_completed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: next
        name: Select incomplete fixed environments
        shell: bash
        run: |
          # The results branch is force-updated after each segment.  Fetch it
          # into the tracking ref explicitly; `git fetch origin <branch>` only
          # updates FETCH_HEAD and leaves origin/metagame-v8-results stale.
          results_ref="refs/remotes/origin/metagame-v8-results"
          remote_result="$(git ls-remote --heads origin metagame-v8-results)"
          if [ -n "$remote_result" ]; then
            git fetch --no-tags origin "+refs/heads/metagame-v8-results:$results_ref"
          fi
          is_complete() {
            local progress_path="$1"
            local progress
            progress="$(git show "$results_ref:$progress_path" 2>/dev/null)" || return 1
            jq -e '.status == "complete" and .context.version == "team-battle-v8.0"' \
              <<< "$progress" >/dev/null
          }

          targets='[]'
          work_items='[]'
          # Keep every run within the 20 standard-runner capacity: four inputs
          # times five positions. The next incomplete batch is dispatched after
          # this one has saved its merged checkpoints.
          input_ids=("fire:100" "water:100" "wind:100" "fire-water:100" "fire-wind:100" "water-wind:100" "all:100")
          for input_id in "${input_ids[@]}"; do
            if [ "$(jq 'length' <<< "$targets")" -ge 4 ]; then
              break
            fi
            output_directory="${input_id//:/-}"
            progress_path="reports/metagame-ratings-v8/$output_directory/progress.json"
            if is_complete "$progress_path"; then
              continue
            fi

            targets="$(jq -c --arg input "$input_id" --arg output_directory "$output_directory" \
              '. + [{input: $input, output_directory: $output_directory}]' <<< "$targets")"
            for position in 1 2 3 4 5; do
              work_items="$(jq -c --arg input "$input_id" --arg output_directory "$output_directory" --argjson position "$position" \
                '. + [{input: $input, output_directory: $output_directory, position: $position}]' <<< "$work_items")"
            done
          done

          work_matrix="$(jq -cn --argjson include "$work_items" '{include: $include}')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "work_matrix=$work_matrix" >> "$GITHUB_OUTPUT"
          if [ "$targets" = '[]' ]; then
            echo "all_completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_completed=false" >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    needs: select
    if: needs.select.outputs.all_completed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # The repository is public and GitHub Free permits 20 standard hosted jobs.
      # Four independent inputs times five deck positions use that capacity exactly.
      max-parallel: 20
      matrix: ${{ fromJSON(needs.select.outputs.work_matrix) }}
    env:
      METAGAME_TIME_BUDGET_SECONDS: "10000"
      METAGAME_INPUT: ${{ matrix.input }}
      METAGAME_OUTPUT_DIRECTORY: ${{ matrix.output_directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore the canonical progress for this input and position
        shell: bash
        run: |
          checkpoint_path="$RUNNER_TEMP/v8-position-progress/${METAGAME_OUTPUT_DIRECTORY}-position-${{ matrix.position }}.json"
          mkdir -p "$(dirname "$checkpoint_path")"
          results_ref="refs/remotes/origin/metagame-v8-results"
          remote_result="$(git ls-remote --heads origin metagame-v8-results)"
          if [ -n "$remote_result" ]; then
            git fetch --no-tags origin "+refs/heads/metagame-v8-results:$results_ref"
          fi
          progress_path="reports/metagame-ratings-v8/${METAGAME_OUTPUT_DIRECTORY}/progress.json"
          if git show "$results_ref:$progress_path" > "$checkpoint_path" 2>/dev/null; then
            echo "Restored canonical progress for ${METAGAME_INPUT}, position ${{ matrix.position }}"
          fi

      - id: rate
        name: Evaluate ${{ matrix.input }}, position ${{ matrix.position }}
        continue-on-error: true
        run: |
          node scripts/rate-metagame-v7.mjs \
            --input="$METAGAME_INPUT" \
            --position=${{ matrix.position }} \
            --checkpoint-path="$RUNNER_TEMP/v8-position-progress/${METAGAME_OUTPUT_DIRECTORY}-position-${{ matrix.position }}.json" \
            --time-budget-seconds="$METAGAME_TIME_BUDGET_SECONDS"

      - name: Upload position progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-progress-${{ matrix.output_directory }}-${{ matrix.position }}
          path: ${{ runner.temp }}/v8-position-progress/${{ matrix.output_directory }}-position-${{ matrix.position }}.json
          if-no-files-found: warn
          retention-days: 2

      - name: Propagate an evaluation error after saving progress
        if: always() && steps.rate.outcome == 'failure'
        run: exit 1

  publish:
    needs: [select, evaluate]
    if: always() && needs.select.outputs.all_completed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore the v8 result branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_result="$(git ls-remote --heads origin metagame-v8-results)"
          if [ -n "$remote_result" ]; then
            git fetch --no-tags origin "+refs/heads/metagame-v8-results:refs/remotes/origin/metagame-v8-results"
          fi
          if git show-ref --verify --quiet refs/remotes/origin/metagame-v8-results; then
            git switch --create metagame-v8-results --track origin/metagame-v8-results
          else
            git switch --create metagame-v8-results
          fi
          git rebase ${{ github.sha }}

      - id: download
        name: Download independent position checkpoints
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: v8-progress-*
          merge-multiple: true
          path: ${{ runner.temp }}/v8-position-progress

      - id: finalize
        name: Merge checkpoints for every selected input
        continue-on-error: true
        shell: bash
        env:
          TARGETS: ${{ needs.select.outputs.targets }}
        run: |
          set +e
          finalization_failed=false
          while IFS= read -r target; do
            input="$(jq -r '.input' <<< "$target")"
            output_directory="$(jq -r '.output_directory' <<< "$target")"
            checkpoint_paths="$(printf '%s,' \
              "$RUNNER_TEMP/v8-position-progress/${output_directory}-position-1.json" \
              "$RUNNER_TEMP/v8-position-progress/${output_directory}-position-2.json" \
              "$RUNNER_TEMP/v8-position-progress/${output_directory}-position-3.json" \
              "$RUNNER_TEMP/v8-position-progress/${output_directory}-position-4.json" \
              "$RUNNER_TEMP/v8-position-progress/${output_directory}-position-5.json")"
            checkpoint_paths="${checkpoint_paths%,}"
            node scripts/rate-metagame-v7.mjs \
              --input="$input" \
              --position=all \
              --checkpoint-path="reports/metagame-ratings-v8/${output_directory}/progress.json" \
              --merge-checkpoint-paths="$checkpoint_paths" \
              --finalize-only=true
            if [ "$?" -ne 0 ]; then
              finalization_failed=true
            fi
          done < <(jq -c '.[]' <<< "$TARGETS")
          if [ "$finalization_failed" = true ]; then
            exit 1
          fi

      - id: status
        name: Check all environment evaluation statuses
        if: always()
        shell: bash
        env:
          TARGETS: ${{ needs.select.outputs.targets }}
        run: |
          is_complete_file() {
            local progress_path="$1"
            [ -f "$progress_path" ] && jq -e \
              '.status == "complete" and .context.version == "team-battle-v8.0"' \
              "$progress_path" >/dev/null
          }

          completed_any=false
          while IFS= read -r target; do
            output_directory="$(jq -r '.output_directory' <<< "$target")"
            if is_complete_file "reports/metagame-ratings-v8/${output_directory}/progress.json"; then
              completed_any=true
            fi
          done < <(jq -c '.[]' <<< "$TARGETS")

          all_completed=true
          for output_directory in fire-100 water-100 wind-100 fire-water-100 fire-wind-100 water-wind-100 all-100; do
            if ! is_complete_file "reports/metagame-ratings-v8/${output_directory}/progress.json"; then
              all_completed=false
              break
            fi
          done
          echo "completed_any=$completed_any" >> "$GITHUB_OUTPUT"
          echo "all_completed=$all_completed" >> "$GITHUB_OUTPUT"

      - id: recovery
        name: Record recoverable evaluation failures
        if: always()
        shell: bash
        run: |
          state_path="reports/metagame-ratings-v8/recovery.json"
          mkdir -p "$(dirname "$state_path")"
          outcome="${{ steps.finalize.outcome }}"
          if [ "${{ steps.download.outcome }}" != "success" ] || [ "${{ needs.evaluate.result }}" != "success" ]; then
            outcome="failure"
          fi
          previous=0
          if [ -f "$state_path" ]; then
            previous="$(jq -r '.consecutiveFailures // 0' "$state_path" 2>/dev/null || echo 0)"
          fi
          if [ "$outcome" = "failure" ]; then
            failures=$((previous + 1))
          else
            failures=0
          fi
          printf '{\n  "consecutiveFailures": %s,\n  "lastOutcome": "%s",\n  "updatedAt": "%s"\n}\n' \
            "$failures" "$outcome" "$(date --iso-8601=seconds)" > "$state_path"
          if [ "${{ steps.status.outputs.all_completed }}" = "true" ]; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=false" >> "$GITHUB_OUTPUT"
          elif [ "$outcome" = "failure" ] && [ "$failures" -ge 3 ]; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build browser data from completed v8 reports
        if: steps.status.outputs.completed_any == 'true' && steps.finalize.outcome == 'success' && steps.download.outcome == 'success' && needs.evaluate.result == 'success'
        run: npm run build

      - name: Save v8 progress to the result branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/metagame-ratings-v8
          if [ -f src/data/metagame-simulator-data.js ]; then git add src/data/metagame-simulator-data.js; fi
          if [ -f index.html ]; then git add index.html; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: save metagame v8 evaluation progress"
          git push --force-with-lease=refs/heads/metagame-v8-results origin HEAD:metagame-v8-results

      - name: Create an issue after automatic retries are exhausted
        if: always() && steps.recovery.outputs.retry_exhausted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The V8 5v5 metagame evaluator stopped after three consecutive failures. Progress and recovery state are saved on the metagame-v8-results branch. Review the latest Actions run for the error log."
          payload="$(jq -n --arg title "V8 evaluation stopped after automatic retries" --arg body "$body" '{title: $title, body: $body}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/issues" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload"

      - name: Start the next evaluation segment
        if: always() && steps.recovery.outputs.should_continue == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/metagame-v7-cloud.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"${{ github.ref_name }}"}'

      - name: Mark unrecoverable evaluation failure
        if: always() && steps.recovery.outputs.retry_exhausted == 'true'
        run: exit 1

  publish-browser-data:
    # Publish when this segment saved data, or when a source change finds an
    # already-complete evaluation. The latter also repairs a missed publish.
    needs: [select, publish]
    if: >
      always() &&
      (needs.select.outputs.all_completed == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: update
        name: Build and publish browser data to master
        shell: bash
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          data_path="src/data/metagame-simulator-data.js"
          results_ref="refs/remotes/origin/metagame-v8-results"

          # The first segment has no result branch yet. Later failures must
          # not publish stale data, so always fetch the force-updated branch.
          if ! git ls-remote --exit-code --heads origin metagame-v8-results >/dev/null; then
            echo "No v8 result branch exists yet."
            exit 0
          fi
          git fetch --no-tags origin \
            "+refs/heads/master:refs/remotes/origin/master" \
            "+refs/heads/metagame-v8-results:$results_ref"

          git switch --detach origin/master
          git checkout "$results_ref" -- reports/metagame-ratings-v8
          npm run build:metagame-data
          node --input-type=module -e 'import { METAGAME_SIMULATOR_DATA as data } from "./src/data/metagame-simulator-data.js"; if (data.sourceModelVersion !== "team-battle-v8.0") throw new Error("V8 browser-data build used an incompatible model."); if (!data.constraints.length) { console.log("No fully completed V8 constraint yet; keeping the existing public data."); process.exit(0); } console.log(`Built ${data.constraints.length} V8 browser constraints.`);'
          if git diff --quiet -- "$data_path"; then
            echo "The public app already has the latest browser data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$data_path"
          git commit --only "$data_path" -m "chore: publish completed v8 metagame data"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the updated public site
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"master"}'
