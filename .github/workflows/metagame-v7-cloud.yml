name: Metagame v7 fixed-environment evaluation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/metagame-v7-cloud.yml
      - scripts/rate-metagame-v7.mjs
      - scripts/build-metagame-simulator-data.mjs
      - src/core/metagame-v7.js
      - src/core/metagame-deck.js
      - src/core/simulate.js
      - src/data/metagame-v7-inputs.js
      - src/data/workbook-characters.js
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: metagame-v7
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      input: ${{ steps.next.outputs.input }}
      output_directory: ${{ steps.next.outputs.output_directory }}
      all_completed: ${{ steps.next.outputs.all_completed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: next
        name: Select the next fixed environment
        shell: bash
        run: |
          git fetch origin metagame-v7-results || true
          is_complete() {
            local progress_path="$1"
            git show "origin/metagame-v7-results:$progress_path" 2>/dev/null | grep -q '"status": "complete"' && \
              git show "origin/metagame-v7-results:$progress_path" 2>/dev/null | grep -q '"version": "fixed-environment-v7.2"'
          }
          input_ids=("fire:100" "water:100" "wind:100" "fire-water:100")
          for input_id in "${input_ids[@]}"; do
            output_directory="${input_id//:/-}"
            progress_path="reports/metagame-ratings-v7/$output_directory/progress.json"
            if is_complete "$progress_path"; then
              continue
            fi
            echo "input=$input_id" >> "$GITHUB_OUTPUT"
            echo "output_directory=$output_directory" >> "$GITHUB_OUTPUT"
            echo "all_completed=false" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "input=" >> "$GITHUB_OUTPUT"
          echo "output_directory=" >> "$GITHUB_OUTPUT"
          echo "all_completed=true" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: select
    if: needs.select.outputs.input != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        position: [1, 2, 3, 4, 5]
    env:
      METAGAME_TIME_BUDGET_SECONDS: "10000"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore the canonical progress for this position
        shell: bash
        run: |
          checkpoint_path="$RUNNER_TEMP/v7-position-progress/position-${{ matrix.position }}.json"
          mkdir -p "$(dirname "$checkpoint_path")"
          git fetch origin metagame-v7-results || true
          progress_path="reports/metagame-ratings-v7/${{ needs.select.outputs.output_directory }}/progress.json"
          if git show "origin/metagame-v7-results:$progress_path" > "$checkpoint_path" 2>/dev/null; then
            echo "Restored canonical progress for position ${{ matrix.position }}"
          fi

      - id: rate
        name: Evaluate position ${{ matrix.position }}
        continue-on-error: true
        run: |
          node scripts/rate-metagame-v7.mjs \
            --input="${{ needs.select.outputs.input }}" \
            --position=${{ matrix.position }} \
            --checkpoint-path="$RUNNER_TEMP/v7-position-progress/position-${{ matrix.position }}.json" \
            --time-budget-seconds="$METAGAME_TIME_BUDGET_SECONDS"

      - name: Upload position progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-progress-${{ needs.select.outputs.output_directory }}-${{ matrix.position }}
          path: ${{ runner.temp }}/v7-position-progress/position-${{ matrix.position }}.json
          if-no-files-found: warn
          retention-days: 2

      - name: Propagate an evaluation error after saving progress
        if: always() && steps.rate.outcome == 'failure'
        run: exit 1

  publish:
    needs: [select, evaluate]
    if: always() && needs.select.outputs.input != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore the v7 result branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin metagame-v7-results || true
          if git show-ref --verify --quiet refs/remotes/origin/metagame-v7-results; then
            git switch --create metagame-v7-results --track origin/metagame-v7-results
          else
            git switch --create metagame-v7-results
          fi
          git rebase ${{ github.sha }}

      - name: Download position progress
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: v7-progress-${{ needs.select.outputs.output_directory }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/v7-position-progress

      - id: finalize
        name: Merge the five position checkpoints
        continue-on-error: true
        shell: bash
        run: |
          checkpoint_paths="$(printf '%s,' "$RUNNER_TEMP/v7-position-progress/position-1.json" "$RUNNER_TEMP/v7-position-progress/position-2.json" "$RUNNER_TEMP/v7-position-progress/position-3.json" "$RUNNER_TEMP/v7-position-progress/position-4.json" "$RUNNER_TEMP/v7-position-progress/position-5.json")"
          checkpoint_paths="${checkpoint_paths%,}"
          node scripts/rate-metagame-v7.mjs \
            --input="${{ needs.select.outputs.input }}" \
            --position=all \
            --checkpoint-path="reports/metagame-ratings-v7/${{ needs.select.outputs.output_directory }}/progress.json" \
            --merge-checkpoint-paths="$checkpoint_paths" \
            --finalize-only=true

      - id: status
        name: Check evaluation status
        if: always()
        shell: bash
        run: |
          progress_path="reports/metagame-ratings-v7/${{ needs.select.outputs.output_directory }}/progress.json"
          input_completed=false
          if [ -f "$progress_path" ] && grep -q '"status": "complete"' "$progress_path" && grep -q '"version": "fixed-environment-v7.2"' "$progress_path"; then
            input_completed=true
          fi
          all_completed=true
          for output_directory in fire-100 water-100 wind-100 fire-water-100; do
            if ! [ -f "reports/metagame-ratings-v7/$output_directory/progress.json" ] || ! grep -q '"status": "complete"' "reports/metagame-ratings-v7/$output_directory/progress.json" || ! grep -q '"version": "fixed-environment-v7.2"' "reports/metagame-ratings-v7/$output_directory/progress.json"; then
              all_completed=false
              break
            fi
          done
          echo "input_completed=$input_completed" >> "$GITHUB_OUTPUT"
          echo "all_completed=$all_completed" >> "$GITHUB_OUTPUT"

      - id: recovery
        name: Record recoverable evaluation failures
        if: always()
        shell: bash
        run: |
          state_path="reports/metagame-ratings-v7/${{ needs.select.outputs.output_directory }}/recovery.json"
          mkdir -p "$(dirname "$state_path")"
          outcome="${{ steps.finalize.outcome }}"
          if [ "${{ needs.evaluate.result }}" != "success" ]; then
            outcome="failure"
          fi
          previous=0
          if [ -f "$state_path" ]; then
            previous="$(jq -r '.consecutiveFailures // 0' "$state_path" 2>/dev/null || echo 0)"
          fi
          if [ "$outcome" = "failure" ]; then
            failures=$((previous + 1))
          else
            failures=0
          fi
          printf '{\n  "consecutiveFailures": %s,\n  "lastOutcome": "%s",\n  "updatedAt": "%s"\n}\n' \
            "$failures" "$outcome" "$(date --iso-8601=seconds)" > "$state_path"
          if [ "${{ steps.status.outputs.all_completed }}" = "true" ]; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=false" >> "$GITHUB_OUTPUT"
          elif [ "$outcome" = "failure" ] && [ "$failures" -ge 3 ]; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build browser data from the completed v7 report
        if: steps.status.outputs.input_completed == 'true' && steps.finalize.outcome == 'success' && needs.evaluate.result == 'success'
        run: npm run build

      - name: Save v7 progress to the result branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/metagame-ratings-v7
          if [ -f src/data/metagame-simulator-data.js ]; then git add src/data/metagame-simulator-data.js; fi
          if [ -f index.html ]; then git add index.html; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: save metagame v7 evaluation progress"
          git push --force-with-lease=refs/heads/metagame-v7-results origin HEAD:metagame-v7-results

      - name: Create an issue after automatic retries are exhausted
        if: always() && steps.recovery.outputs.retry_exhausted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The v7 metagame evaluator for ${{ needs.select.outputs.input }} failed three consecutive times. Progress and recovery state are saved on the metagame-v7-results branch. Review the latest Actions run for the error log."
          payload="$(jq -n --arg title "v7 evaluation stopped after automatic retries" --arg body "$body" '{title: $title, body: $body}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/issues" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload"

      - name: Start the next evaluation segment
        if: always() && steps.recovery.outputs.should_continue == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/metagame-v7-cloud.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"${{ github.ref_name }}"}'

      - name: Mark unrecoverable evaluation failure
        if: always() && steps.recovery.outputs.retry_exhausted == 'true'
        run: exit 1
