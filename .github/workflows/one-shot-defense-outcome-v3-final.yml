name: Finalize all-defense outcome evaluation fix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/one-shot-defense-outcome-v3-final.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reuse tested defense patch and update V12 expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-shot-defense-outcome-v3.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'defense-patch', 'exec'))

          test_path = Path('test/metagame-v12.test.js')
          test_text = test_path.read_text()
          test_text = test_text.replace(
            'team-battle-v12.2-threshold-proxy',
            'team-battle-v12.3-defense-outcome',
          )
          test_path.write_text(test_text)
          PY

      - name: Run defense and battle regressions
        run: |
          node --test \
            test/team-battle-ai-regression.test.js \
            test/simulate.test.js \
            test/skills.test.js \
            test/skill-use-revive-regression.test.js \
            test/v12-battle-corrections.test.js

      - name: Run V12 regression suite
        shell: bash
        run: |
          mapfile -t files < <(find test -maxdepth 1 -type f -name '*v12*.test.js' -print | sort)
          node --test "${files[@]}"

      - name: Commit tested defense model
        shell: bash
        run: |
          rm -f \
            .github/workflows/one-shot-defense-outcome-v3-final.yml \
            .github/workflows/one-shot-defense-outcome-v3.yml \
            .github/workflows/one-shot-guard-survival-fix.yml \
            .github/workflows/commit-guard-survival-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: evaluate all defense skills by battle outcomes"
          git push origin HEAD:master
