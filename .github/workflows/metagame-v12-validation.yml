name: Validate Metagame V12

on:
  pull_request:
    paths:
      - "src/core/simulate.js"
      - "src/core/metagame-v12.js"
      - "src/core/skills.js"
      - "src/data/character-catalog.js"
      - "src/data/metagame-v8-inputs.js"
      - "src/data/metagame-v12-sweep-inputs.js"
      - "src/styles.css"
      - "src/eigomonogatari-theme.css"
      - "src/index.template.html"
      - "src/ui/metagame-v12-compat.js"
      - "src/ui/metagame-v12-precomputed-first.js"
      - "scripts/rate-metagame-v12.mjs"
      - "scripts/build-metagame-v12-work-matrix.mjs"
      - "scripts/build-metagame-simulator-data-v12.mjs"
      - "scripts/build-final.mjs"
      - "test/team-battle-ai-regression.test.js"
      - "test/simulate.test.js"
      - "test/metagame-v12.test.js"
      - "test/metagame-v12-browser-cache.test.js"
      - "test/metagame-v12-sweep-inputs.test.js"
      - "test/skills.test.js"
      - "test/attack-mode-target-routing.test.js"
      - ".github/workflows/metagame-v12-*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check battle, V12 and browser cache scripts
        run: |
          node --check src/core/simulate.js
          node --check src/core/skills.js
          node --check src/core/metagame-v12.js
          node --check src/data/metagame-v8-inputs.js
          node --check src/data/metagame-v12-sweep-inputs.js
          node --check src/ui/metagame-v12-compat.js
          node --check src/ui/metagame-v12-precomputed-first.js
          node --check scripts/rate-metagame-v12.mjs
          node --check scripts/build-metagame-v12-work-matrix.mjs
          node --check scripts/build-metagame-simulator-data-v12.mjs
          node --check scripts/build-final.mjs
      - name: Verify public bundle builds with cache policy
        run: node scripts/build-final.mjs --skip-metagame-data
      - name: Run battle, V12, sweep and browser cache focused tests
        run: node --test test/team-battle-ai-regression.test.js test/simulate.test.js test/skills.test.js test/attack-mode-target-routing.test.js test/metagame-v12.test.js test/metagame-v12-browser-cache.test.js test/metagame-v12-sweep-inputs.test.js
